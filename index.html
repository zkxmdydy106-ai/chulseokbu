<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>출석부</title>
<style>
/* 교과 출석부 — 나이스 4세대 화면 결. 흰 바탕·연회색 테두리·파란 막대 소제목·파란 버튼.
   학생 자료는 이 폰(브라우저) 안에만 저장한다. 외부 글꼴·라이브러리·통신 없음. */
:root {
  --bg: #f4f6f9; --panel: #fff; --line: #dde2e9; --line-2: #eceff4; --head: #f3f5f9;
  --text: #222; --text-2: #555; --text-3: #8a9099;
  --blue: #2a64d6; --blue-dark: #1f4fb2; --blue-soft: #eef3fd;
  --res: #c4392b; --res-bg: #fdeceb; --rec: #2a64d6; --rec-bg: #e9f0fd;
  --fill: #fff4c2; --fill-ink: #6b5200; --ok: #1f8a4c;
  --ff: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); }
body { color: var(--text); font: 15px/1.5 var(--ff); -webkit-font-smoothing: antialiased; min-height: 100dvh; padding-bottom: calc(64px + var(--safe-b)); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

header.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.app-name { font-size: 16px; font-weight: 700; color: var(--blue); letter-spacing: -0.02em; }
.datenav { display: flex; align-items: center; gap: 2px; }
.datenav button { width: 34px; height: 34px; border: 0; background: none; font-size: 20px; color: var(--text-2); }
.datenav label { position: relative; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; font-size: 14px; font-weight: 600; }
.datenav input { position: absolute; inset: 0; opacity: 0; }
.today-dot { margin-left: 4px; font-size: 11px; font-weight: 600; color: var(--blue); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: var(--safe-b); background: var(--panel); border-top: 1px solid var(--line); }
nav.tabs button { height: 56px; border: 0; background: none; font-size: 14px; font-weight: 600; color: var(--text-3); border-top: 2px solid transparent; }
nav.tabs button.on { color: var(--blue); border-top-color: var(--blue); }
nav.tabs button { position: relative; letter-spacing: -0.03em; }
.tab-badge { position: absolute; top: 5px; left: calc(50% + 14px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--res); color: #fff; font-size: 11px; font-weight: 700; line-height: 17px; }

main { padding: 12px; }
.card { margin-bottom: 10px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.sec { position: relative; margin: 0 0 10px; padding-left: 11px; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
.sec::before { content: ""; position: absolute; left: 0; top: 4px; width: 4px; height: 16px; background: var(--blue); }
.sub { margin: 12px 0 6px; font-size: 13px; font-weight: 700; color: var(--text-2); }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--text-2); }
.hint.warn { color: var(--res); }
.acc-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 2px; font-size: 13px; overflow-wrap: anywhere; }
.acc-line b { color: var(--text); }
.dim { color: var(--text-3); }

/* 고르기 칩 */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-width: 44px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font-size: 14px; font-weight: 600; }
.chip.on { border-color: var(--blue); background: var(--blue); color: #fff; }
.chip small { margin-left: 4px; font-size: 11px; font-weight: 500; opacity: .8; }

/* 학생 칸 */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
@media (min-width: 520px) { .grid { grid-template-columns: repeat(6, 1fr); } }
.stu { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 68px; padding: 6px 2px; border: 1px solid var(--line); border-radius: 4px; background: #fff; user-select: none; touch-action: manipulation; }
.stu b { font-size: 20px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; }
.stu span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--text-2); }
.stu i { position: absolute; top: 3px; right: 5px; font-style: normal; font-size: 15px; font-weight: 800; }
.stu.res { border-color: var(--res); background: var(--res-bg); }
.stu.res i, .stu.res b { color: var(--res); }
.stu.rec { border-color: var(--rec); background: var(--rec-bg); }
.stu.rec i, .stu.rec b { color: var(--rec); }
.stu.has-r::after { content: ""; position: absolute; left: 6px; top: 6px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; color: var(--text-3); }
.stu:active { transform: scale(.97); }

.sumbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 14px; }
.sumbar b { font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--text-2); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; border: 1px solid; border-radius: 2px; }
.legend .l-res::before { border-color: var(--res); background: var(--res-bg); }
.legend .l-rec::before { border-color: var(--rec); background: var(--rec-bg); }
.saved-tag { font-size: 12px; color: var(--ok); }

/* 버튼 */
.btn { height: 44px; padding: 0 16px; border: 1px solid #c5ccd6; border-radius: 4px; background: #fff; font-size: 15px; font-weight: 600; }
.btn.main { border-color: var(--blue); background: var(--blue); color: #fff; }
.btn.main:disabled { border-color: var(--line); background: var(--line-2); color: var(--text-3); }
.btn.full { width: 100%; }
.btn.small { height: 34px; padding: 0 12px; font-size: 13px; }
.btn.danger { border-color: var(--res); color: var(--res); }
.sy-ok { color: var(--ok); } .sy-bad { color: var(--res); } .textbtn.danger { color: var(--res); }
.row { display: flex; gap: 6px; margin-top: 10px; }
.row .btn { flex: 1; }
.textbtn { padding: 0; border: 0; background: none; color: var(--blue); font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }

/* 입력 */
.field { display: block; margin-top: 10px; }
.field span { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.field input, .field textarea, .field select { width: 100%; padding: 10px; border: 1px solid #c5ccd6; border-radius: 4px; background: #fff; font-size: 15px; }
.field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--blue); }

/* 표 */
table.list { width: 100%; border-collapse: collapse; border-top: 2px solid #5a6475; font-size: 13.5px; }
table.list th { padding: 7px 6px; background: var(--head); border-bottom: 1px solid var(--line); text-align: left; font-weight: 600; color: var(--text-2); }
table.list td { padding: 8px 6px; border-bottom: 1px solid var(--line-2); }
table.list .c { text-align: center; }

/* 사유 시트 */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(20, 24, 31, .35); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; padding: 16px 14px calc(16px + var(--safe-b)); background: var(--panel); border-top: 1px solid var(--line); border-radius: 10px 10px 0 0; animation: up .16s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .5; } }
.sheet h3 { margin: 0 0 4px; font-size: 17px; }
.marks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.marks button { height: 44px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font-weight: 700; }
.marks button.on[data-m=""] { border-color: var(--text); }
.marks button.on[data-m="/"] { border-color: var(--res); background: var(--res-bg); color: var(--res); }
.marks button.on[data-m="Ø"] { border-color: var(--rec); background: var(--rec-bg); color: var(--rec); }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.reasons button { height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 17px; background: #fff; font-size: 13.5px; }

/* 담임 일일출결 */
.stu small { font-size: 11px; font-weight: 700; }
.stu.day-abs { border-color: var(--res); background: var(--res-bg); }
.stu.day-abs b, .stu.day-abs small { color: var(--res); }
.stu.day-late { border-color: #c98a00; background: #fff6dc; }
.stu.day-late b, .stu.day-late small { color: #8a5d00; }
.stu.day-rec { border-color: var(--rec); background: var(--rec-bg); }
.stu.day-rec b, .stu.day-rec small { color: var(--rec); }
.stu .need { position: absolute; left: 5px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--res); }
.seg { display: grid; gap: 6px; margin-top: 8px; }
.seg.c5 { grid-template-columns: repeat(5, 1fr); }
.seg.c4 { grid-template-columns: repeat(4, 1fr); }
.seg button { height: 40px; padding: 0 2px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; letter-spacing: -0.04em; }
.seg.c4 button { font-size: 13px; }
.seg button.on { border-color: var(--blue); background: var(--blue); color: #fff; }
.seg button:disabled { opacity: .35; }
.lab { margin: 12px 0 0; font-size: 13px; font-weight: 700; color: var(--text-2); }
.docs { margin: 10px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line-2); }
.docs li { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line-2); font-size: 14px; }
.docs li input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--blue); }
.docs li span { flex: 1; }
.docs li.done span { color: var(--text-3); text-decoration: line-through; }
.docs .cnt { display: flex; align-items: center; gap: 4px; }
.docs .cnt button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font-weight: 700; }
.badge { display: inline-block; padding: 0 6px; border-radius: 2px; font-size: 12px; font-weight: 600; background: var(--head); color: var(--text-2); }
.badge.late { background: var(--res-bg); color: var(--res); }
.badge.ok { background: #e3f3e8; color: var(--ok); }
.trip { margin-top: 8px; font-size: 13px; color: var(--text-2); }
.trip b.over { color: var(--res); }
.sheet { max-height: 88dvh; overflow-y: auto; }
.contact { display: flex; align-items: center; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-2); font-size: 14px; }
.contact span { flex: 1; color: var(--text-2); }
.contact b { color: var(--text); font-variant-numeric: tabular-nums; }
.qrbox { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 10px 0 4px; text-align: center; }
.qrbox img { image-rendering: pixelated; background: #fff; }
.contact .btn { display: inline-flex; align-items: center; text-decoration: none; color: var(--text); }
.toast { position: fixed; left: 50%; bottom: calc(76px + var(--safe-b)); z-index: 30; transform: translateX(-50%); padding: 9px 14px; border-radius: 4px; background: #2b313b; color: #fff; font-size: 13.5px; white-space: nowrap; animation: up .16s ease-out; }
.empty { padding: 28px 10px; text-align: center; color: var(--text-2); }
.empty b { display: block; margin-bottom: 6px; font-size: 16px; color: var(--text); }
.warnbox { margin-top: 10px; padding: 9px 10px; background: var(--fill); color: var(--fill-ink); font-size: 13px; border-radius: 4px; }
/* 서류함(학생이 낸 서류) */
.steps { margin: 8px 0 0; padding-left: 20px; font-size: 14px; color: var(--text-2); }
.steps li { margin: 7px 0; }
.steps b { color: var(--text); }
.bx li { align-items: flex-start; }
.docs li .badge { flex: none; }
.bx li span small { font-size: 12.5px; }
.sfv { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: #e9ecf1; }
.sfv-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
.sfv-bar .sp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.sfv-info { padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
.sfv-info b { color: var(--text); }
.sfv-pages { flex: 1; overflow: auto; padding: 0 6px; }
body.sfv-open { overflow: hidden; }
@media print {
  body.sf-printing { padding: 0; background: #fff; }
  body.sf-printing > *:not(.sfv) { display: none !important; }
  body.sf-printing .sfv { position: static; display: block; background: #fff; }
  body.sf-printing .sfv-bar, body.sf-printing .sfv-info { display: none !important; }
  body.sf-printing .sfv-pages { overflow: visible; padding: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <span class="app-name">출석부</span>
  <div class="datenav" id="dateNav">
    <button id="dPrev" aria-label="전날">‹</button>
    <label><span id="dLabel"></span><input type="date" id="dPick" aria-label="날짜 고르기"></label>
    <button id="dNext" aria-label="다음 날">›</button>
  </div>
</header>

<main id="main"></main>

<nav class="tabs" id="tabs">
  <button data-tab="check" class="on">출석</button>
  <button data-tab="docs">서류</button>
  <button data-tab="box">서류함<span class="tab-badge" id="boxBadge" hidden></span></button>
  <button data-tab="export">내보내기</button>
  <button data-tab="setup">설정</button>
</nav>

<script>
(() => {
  'use strict';
  // ── 저장(이 폰 안에만) ─────────────────────────────────
  // 담임 출석부와 수업 출석부는 따로(교사 결정 2026-10-28) — 주소 ?app=class면 수업 출석부(따로 저장, 홈 화면 아이콘도 따로)
  const APP = new URLSearchParams(location.search).get('app') === 'class' ? 'class' : 'home';
  const KEY = APP === 'class' ? 'chulseokbu.class.v1' : 'chulseokbu.v1';
  document.title = APP === 'class' ? '수업 출석부' : '담임 출석부';
  // 수업 출석부에는 담임 일(서류·서류함·학교 서식·교시 시각·일일출결)이 없다(교사 결정 2026-10-28)
  { // 머리글·탭은 이 스크립트 위에 이미 있음
    const n = document.querySelector('.app-name'); if (n) n.textContent = document.title;
    if (APP === 'class') document.querySelectorAll('#tabs [data-tab="docs"], #tabs [data-tab="box"]').forEach((b) => b.remove());
  }
  // 교시 시각(쉬는 시간·점심·청소는 적지 않음). 종례는 마지막 교시 뒤로 본다
  const BELLS_TEXT = ['조회 08:40-08:50', '1교시 08:50-09:40', '2교시 09:50-10:40', '3교시 10:50-11:40', '4교시 11:50-12:40', '5교시 13:30-14:20', '6교시 14:30-15:20', '7교시 15:40-16:30'].join('\n');
  // marks: 교과(교시별 / Ø), cases·daily·cleared: 담임 일일출결(사안 하나가 여러 날일 수 있음), cfg: 서류 기한·체험학습 최대 일수
  // school: 학생 서류 서식(교사 결정 2026-10-28: 공통 서식 + 학교 이름·결재 칸, 강경고 서식은 고를 수 있게)
  const SCHOOL0 = { name: '', appr: ['담임', '부장', '교감', '교장'], form: 'common' };
  const blank = () => ({ v: 1, classes: [], marks: {}, cases: {}, daily: {}, cleared: {}, cfg: { deadline: 7, tripMax: 15, bells: BELLS_TEXT, school: { ...SCHOOL0 } }, ui: { pir: 1, classId: '' } });
  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && s.v === 1 && Array.isArray(s.classes) && s.marks && typeof s.marks === 'object') return { ...blank(), ...s, cfg: { ...blank().cfg, ...(s.cfg || {}) }, ui: { ...blank().ui, ...(s.ui || {}) } };
    } catch { /* 깨진 자료는 무시하고 새로 시작 */ }
    return blank();
  }
  let S = loadState();
  // 구글 자동 저장(교사 결정 2026-10-29) — 열쇠·주소는 담임·수업 출석부가 같이 쓰고, 판(rev)·대기는 앱마다
  const SYNC_KEY = 'chulseokbu.sync';
  const SYNC_META = `${KEY}.sync`;
  const SYNC_SLOT = APP === 'class' ? 'c' : 'h';
  const readJson = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
  const writeJson = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch { /* 저장 못 함 */ } };
  const SY = { conf: readJson(SYNC_KEY), meta: readJson(SYNC_META) || { rev: 0, dirty: false, at: 0 }, busy: false, again: false, timer: null, status: '', making: false, sent: null, lastPull: 0 };
  let saveTimer = null;
  // remote: 구글에서 받은 자료를 넣을 때(다시 올리지 않음)
  function save(now = false, { remote = false } = {}) {
    syncBoxTab();
    if (!remote) { S.editedAt = Date.now(); syncMark(); }
    clearTimeout(saveTimer);
    const write = () => {
      try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch { toast('저장 공간이 부족해요. 오래된 기록을 내보내고 지워 주세요.'); return false; }
    };
    if (now) return write();
    saveTimer = setTimeout(write, 150);
    return true;
  }
  window.addEventListener('pagehide', () => save(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });

  // ── 도구 ──────────────────────────────────────────────
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const ymdOf = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const dateOf = (ymd) => new Date(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6));
  const DAYS = '일월화수목금토';
  const showDay = (ymd) => { const d = dateOf(ymd); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`; };
  const isoOf = (ymd) => `${ymd.slice(0, 4)}-${ymd.slice(4, 6)}-${ymd.slice(6)}`;
  const uid = () => Math.random().toString(36).slice(2, 9);
  const MARK = { '': '출석', '/': '결과', 'Ø': '출석인정' };
  const REASONS = ['병원 진료', '보건실', '상담', '조퇴', '지각', '대회 참가', '현장체험', '기타'];
  let toastTimer;
  function toast(msg) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), 2200);
  }

  // 반 이름: '1-3', '1학년 3반', '103' → '1-3'
  function normClass(s) {
    // 수업 출석부: 선택과목 수업 반 이름을 그대로('3학년 302', '2학년 201(F)', '3학년 건강예술실(F)' — 2026-10-28 실제 나이스 모양)
    if (APP === 'class') return String(s || '').trim().replace(/\s+/g, ' ').slice(0, 20);
    const t = String(s || '').replace(/\s+/g, '');
    let m = /^(\d)[-./](\d{1,2})$/.exec(t) || /^(\d)학년(\d{1,2})반$/.exec(t) || /^(\d)(\d{2})$/.exec(t);
    return m ? `${+m[1]}-${+m[2]}` : '';
  }

  // ── 상태 ──────────────────────────────────────────────
  let tab = 'check';
  let day = ymdOf(new Date());
  const key = () => `${day}|${S.ui.pir}|${S.ui.classId}`;
  const cls = (id = S.ui.classId) => S.classes.find((c) => c.id === id) || null;

  // ── 날짜 ──────────────────────────────────────────────
  function paintDate() {
    $('#dLabel').innerHTML = `${esc(showDay(day))}${day === ymdOf(new Date()) ? '<span class="today-dot">오늘</span>' : ''}`;
    $('#dPick').value = isoOf(day);
  }
  function moveDay(n) {
    const d = dateOf(day);
    do { d.setDate(d.getDate() + n); } while (d.getDay() === 0 || d.getDay() === 6); // 주말은 건너뜀
    day = ymdOf(d);
    paintDate();
    if (tab === 'check') renderCheck();
  }
  $('#dPrev').addEventListener('click', () => moveDay(-1));
  $('#dNext').addEventListener('click', () => moveDay(1));
  $('#dPick').addEventListener('change', (e) => { if (e.target.value) { day = e.target.value.replace(/-/g, ''); paintDate(); if (tab === 'check') renderCheck(); } });

  // ── 담임 일일출결: 나이스 구분 16가지(사유 분류 × 상태) + 세부 사유 + 필요 서류 ──
  // ── 시각으로 교시 계산: 빠진 시간과 조금이라도 겹치는 교시를 모두 체크 ──
  // 지각 = [첫 시간 시작, 등교), 조퇴 = [나간 시각, 끝) + 종례, 결과 = [나간 시각, 돌아온 시각)
  const mins = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '').trim()); return m ? +m[1] * 60 + +m[2] : null; };
  function bells(text = S.cfg.bells) {
    const out = [];
    for (const line of String(text || '').split('\n')) {
      const m = /^\s*(조회|종례|(\d{1,2})\s*교시)\s+(\d{1,2}:\d{2})\s*[-~]\s*(\d{1,2}:\d{2})\s*$/.exec(line);
      if (m) out.push({ p: m[2] ? +m[2] : m[1] === '조회' ? 0 : 99, s: mins(m[3]), e: mins(m[4]) });
    }
    return out.filter((b) => b.s !== null && b.e !== null && b.e > b.s).sort((a, b) => a.s - b.s);
  }
  const pName = (p) => (p === 0 ? '조회' : p === 99 ? '종례' : `${p}교시`);
  function periodsFor(type, t1, t2) {
    const B = bells();
    const a = mins(t1), b = mins(t2);
    if (!B.length || a === null) return null;
    let from, to;
    if (type === '지각') { from = B[0].s; to = a; }
    else if (type === '조퇴') { from = a; to = Infinity; }
    else if (type === '결과') { if (b === null || b <= a) return null; from = a; to = b; }
    else return null;
    const hit = B.filter((x) => x.s < to && x.e > from).map((x) => x.p);
    if (type === '조퇴' && !hit.includes(99)) hit.push(99);
    if (!hit.length) return { list: [], text: '', token: '' };
    // 나이스로 넘길 교시 칸: 조퇴는 'n~종례'(그날 있는 교시 전부), 나머지는 목록
    const token = type === '조퇴' ? `${pName(hit[0]).replace('교시', '')}~종례` : hit.map((p) => pName(p).replace('교시', '')).join(',');
    const idx = hit.map((p) => (p === 99 && !B.some((x) => x.p === 99) ? B.length : B.findIndex((x) => x.p === p)));
    const run = hit.length > 2 && idx.every((v, i) => i === 0 || v === idx[i - 1] + 1);
    const text = run ? `${pName(hit[0])}~${pName(hit[hit.length - 1])}` : hit.map(pName).join('·');
    return { list: hit, text, token };
  }
  const nowHM = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

  const TYPES = ['결석', '지각', '조퇴', '결과'];
  const KINDS = ['질병', '미인정', '기타', '출석인정'];
  const SUBS = ['생리', '교외체험학습', '행사·교외활동', '그외'];
  const KIND_SHORT = { 질병: '질병', 미인정: '미인정', 기타: '기타', 출석인정: '인정' };
  const DOC = {
    singo: '결석신고서', diag: '진단서·진료확인서·처방전', official: '관련 공문', list: '참가 명단',
    tripApp: '교외체험학습 신청서', tripRep: '교외체험학습 결과보고서', photo: '사진 (하루 1장 · 보호자와 함께 · 얼굴이 잘 보이게)', proof: '증빙 자료',
  };
  const isHome = (c) => !!c && (c.homeroom || c.subject === '담임');
  const labelOf = (cs) => `${cs.kind}${cs.type}`; // 나이스 구분 이름(예: 질병결석, 출석인정지각)
  // 서류 규칙: 경우마다 받을 서류. 기본값은 처음 만든 학교의 규칙, [서류 → 서류 규칙]에서 학교마다 바꾼다
  const RULE_ROWS = [
    ['sick-absent', '질병결석'], ['sick-late', '질병지각'], ['sick-early', '질병조퇴'], ['sick-result', '질병결과'],
    ['etc-absent', '기타결석'], ['etc-late', '기타지각'], ['etc-early', '기타조퇴'], ['etc-result', '기타결과'],
    ['rec-period', '출석인정 · 생리'], ['rec-event', '출석인정 · 행사·교외활동'], ['rec-trip', '출석인정 · 교외체험학습'], ['rec-other', '출석인정 · 그외'],
    ['unexcused', '미인정 결석·지각·조퇴·결과'],
  ];
  const DEFAULT_RULES = {
    'sick-absent': ['singo', 'diag'], 'etc-absent': ['proof'],
    'rec-period': ['singo'], 'rec-event': ['official', 'list'], 'rec-trip': ['tripApp', 'tripRep', 'photo'], 'rec-other': ['proof'],
  };
  const TYPE_KEY = { 결석: 'absent', 지각: 'late', 조퇴: 'early', 결과: 'result' };
  function ruleKey(cs) {
    if (cs.kind === '출석인정') return `rec-${{ 생리: 'period', 교외체험학습: 'trip', '행사·교외활동': 'event' }[cs.sub] || 'other'}`;
    if (cs.kind === '미인정') return 'unexcused';
    return `${cs.kind === '질병' ? 'sick' : 'etc'}-${TYPE_KEY[cs.type]}`;
  }
  const rules = () => S.cfg.rules || DEFAULT_RULES;
  const docsFor = (cs) => (rules()[ruleKey(cs)] || []).filter((d) => DOC[d]);
  const weekdays = (from, to) => {
    const out = [];
    for (const d = dateOf(from); ymdOf(d) <= to && out.length < 62; d.setDate(d.getDate() + 1)) if (d.getDay() % 6) out.push(ymdOf(d));
    return out;
  };
  function docState(cs) {
    const need = docsFor(cs);
    const days = weekdays(cs.from, cs.to).length;
    const miss = need.filter((d) => (d === 'photo' ? (cs.docs.photo || 0) < days : !cs.docs[d]));
    return { need, miss, days };
  }
  const addDays = (ymd, n) => { const d = dateOf(ymd); d.setDate(d.getDate() + n); return ymdOf(d); };
  const schoolYear = (ymd) => (+ymd.slice(4, 6) >= 3 ? +ymd.slice(0, 4) : +ymd.slice(0, 4) - 1);
  const isTrip = (cs) => cs.kind === '출석인정' && cs.type === '결석' && cs.sub === '교외체험학습';
  // 그 학생의 같은 학년도 교외체험학습 일수(이 사안 빼고)
  function tripDays(cs) {
    return Object.values(S.cases).filter((x) => x.id !== cs.id && x.classId === cs.classId && x.no === cs.no && isTrip(x) && schoolYear(x.from) === schoolYear(cs.from))
      .reduce((n, x) => n + weekdays(x.from, x.to).length, 0);
  }
  const dayKey = (ymd, cid) => `${ymd}|${cid}`;
  const caseOn = (ymd, cid, no) => { const id = (S.daily[dayKey(ymd, cid)] || {})[no]; return id ? S.cases[id] || null : null; };
  function unplace(cs, markCleared) {
    for (const [k, rec] of Object.entries(S.daily)) {
      if (rec[cs.no] !== cs.id) continue;
      delete rec[cs.no];
      if (markCleared) (S.cleared[k] = S.cleared[k] || {})[cs.no] = true;
    }
  }
  function place(cs) {
    unplace(cs, false);
    for (const d of weekdays(cs.from, cs.to)) {
      const k = dayKey(d, cs.classId);
      const other = (S.daily[k] || {})[cs.no];
      if (other && other !== cs.id && S.cases[other]) { const o = S.cases[other]; unplace(o, false); delete S.cases[other]; }
      (S.daily[k] = S.daily[k] || {})[cs.no] = cs.id;
      if (S.cleared[k]) delete S.cleared[k][cs.no];
    }
  }

  function dayTile(s, cs) {
    if (!cs) return `<button class="stu" data-no="${esc(s.no)}"><b>${esc(s.no)}</b><span>${esc(s.name)}</span></button>`;
    const cl = cs.kind === '출석인정' ? 'day-rec' : cs.type === '결석' ? 'day-abs' : 'day-late';
    const miss = docState(cs).miss.length;
    return `<button class="stu ${cl}" data-no="${esc(s.no)}">${miss ? '<em class="need" title="서류 미제출"></em>' : ''}<b>${esc(s.no)}</b><small>${KIND_SHORT[cs.kind]}${cs.type}</small><span>${esc(s.name)}</span></button>`;
  }

  function renderHome(c) {
    const recs = c.students.map((s) => [s, caseOn(day, c.id, s.no)]);
    const n = (t) => recs.filter(([, x]) => x && x.type === t).length;
    const miss = recs.filter(([, x]) => x && docState(x).miss.length).length;
    $('#main').innerHTML = `
      <div class="card">
        <h2 class="sec">${esc(c.name)} 담임 · 일일출결</h2>
        <div class="sub" style="margin-top:0">반</div>
        <div class="chips">${S.classes.map((x) => `<button class="chip ${x.id === c.id ? 'on' : ''}" data-cls="${x.id}">${esc(x.name)}${x.subject ? `<small>${esc(x.subject)}</small>` : ''}</button>`).join('')}</div>
      </div>
      <div class="card">
        <div class="grid" id="stuGrid">${recs.map(([s, x]) => dayTile(s, x)).join('')}</div>
        <div class="sumbar"><div>결석 <b>${n('결석')}</b> · 지각 <b>${n('지각')}</b> · 조퇴 <b>${n('조퇴')}</b> · 결과 <b>${n('결과')}</b></div>${miss ? `<span class="badge late">서류 ${miss}명</span>` : ''}</div>
        <p class="hint">학생을 누르면 나이스 출결 구분과 필요 서류를 적어요. 빨간 점은 서류 미제출.</p>
      </div>`;
  }

  function openDaySheet(no) {
    const c = cls();
    const s = c.students.find((x) => x.no === no);
    const old = caseOn(day, c.id, no);
    const cs = old ? JSON.parse(JSON.stringify(old)) : { id: uid(), classId: c.id, no, type: '결석', kind: '질병', sub: '', reason: '', period: '', from: day, to: day, docs: {} };
    let present = false;
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    const sh = document.createElement('div');
    sh.className = 'sheet';
    document.body.append(bg, sh);
    const close = () => { bg.remove(); sh.remove(); };
    bg.addEventListener('click', close);
    const seg = (cls2, list, cur, attr, dis = () => false) => `<div class="seg ${cls2}">${list.map((v) => `<button data-${attr}="${v}" class="${v === cur ? 'on' : ''}" ${dis(v) ? 'disabled' : ''}>${v.replace('출석인정', '인정').replace('행사·교외활동', '행사·교외')}</button>`).join('')}</div>`;
    function draw() {
      const st = docState(cs);
      const trip = isTrip(cs);
      const used = trip ? tripDays(cs) : 0;
      const t1Label = cs.type === '지각' ? '등교 시각' : '나간 시각';
      const pf = cs.type !== '결석' ? periodsFor(cs.type, cs.t1, cs.t2) : null;
      sh.innerHTML = `
        <h3>${esc(s.no)}번 ${esc(s.name)}</h3>
        <div class="dim" style="font-size:13px">${esc(c.name)} · ${old ? '기록 고치기' : esc(showDay(day))}</div>
        <p class="lab">상태</p>
        ${seg('c5', ['출석', ...TYPES], present ? '출석' : cs.type, 'type')}
        ${present ? '<p class="hint">출석으로 바꾸면 이 기록과 서류 체크를 지워요. 내보낼 때 \'출석\'으로 나가서 나이스의 표시도 지울 수 있어요.</p>' : `
        <p class="lab">사유 분류</p>
        ${seg('c4', KINDS, cs.kind, 'kind')}
        ${cs.kind === '출석인정' ? `<p class="lab">세부 분류</p>${seg('c4', SUBS, cs.sub, 'sub', (v) => v === '교외체험학습' && cs.type !== '결석')}` : ''}
        ${cs.type === '결석' ? `
          <div class="row">
            <label class="field" style="flex:1;margin:0"><span>시작</span><input type="date" id="dsFrom" value="${isoOf(cs.from)}"></label>
            <label class="field" style="flex:1;margin:0"><span>끝</span><input type="date" id="dsTo" value="${isoOf(cs.to)}"></label>
          </div>
          <p class="trip">평일 <b>${st.days}</b>일${trip ? ` · 올해 교외체험학습 <b class="${used + st.days > S.cfg.tripMax ? 'over' : ''}">${used + st.days}</b> / ${S.cfg.tripMax}일${used + st.days > S.cfg.tripMax ? ' — 최대 일수를 넘어요' : ''}` : ''}</p>` : `
          <div class="row">
            <label class="field" style="flex:1;margin:0"><span>${t1Label}</span><input type="time" id="dsT1" value="${esc(cs.t1 || '')}"></label>
            ${cs.type === '결과' ? `<label class="field" style="flex:1;margin:0"><span>돌아온 시각</span><input type="time" id="dsT2" value="${esc(cs.t2 || '')}"></label>` : ''}
          </div>
          <p class="hint">${pf && pf.text ? `나이스에 체크할 교시: <b>${esc(pf.text)}</b>` : pf ? '<span class="over">이 시각에는 겹치는 교시가 없어요. 시각을 확인해 주세요.</span>' : cs.type === '결과' ? '나간 시각과 돌아온 시각을 넣으면 교시를 계산해요.' : '시각을 넣으면 교시를 계산해요.'}${cs.period && !cs.t1 ? ` <span class="dim">(예전 기록: ${esc(cs.period)})</span>` : ''}</p>`}
        <label class="field"><span>사유${cs.kind === '기타' && cs.type === '결석' ? ' (필수)' : ''}</span><input id="dsReason" maxlength="100" value="${esc(cs.reason)}" placeholder="예: 감기로 병원 진료"></label>
        ${st.need.length ? `<p class="lab">필요 서류</p><ul class="docs">${st.need.map((d) => d === 'photo'
          ? `<li class="${(cs.docs.photo || 0) >= st.days ? 'done' : ''}"><span>${DOC[d]}</span><div class="cnt"><button data-ph="-1">−</button><b>${cs.docs.photo || 0}/${st.days}</b><button data-ph="1">+</button></div></li>`
          : `<li class="${cs.docs[d] ? 'done' : ''}"><input type="checkbox" data-doc="${d}" ${cs.docs[d] ? 'checked' : ''}><span>${DOC[d]}</span></li>`).join('')}</ul>` : '<p class="hint dim">이 구분은 따로 받을 서류가 없어요.</p>'}
        ${old && !present ? reqHtml(cs) : ''}`}
        ${contactsHtml(s, cls())}
        <div class="row"><button class="btn" id="dsClose">닫기</button><button class="btn main" id="dsSave">저장</button></div>`;
    }
    function keep() {

      if (f && f.value) cs.from = f.value.replace(/-/g, '');
      if (t && t.value) cs.to = t.value.replace(/-/g, '');
      if (cs.to < cs.from) cs.to = cs.from;
      if (t1) cs.t1 = t1.value;
      if (t2) cs.t2 = t2.value;
      if (cs.type !== '결석' && cs.t1) { const pf = periodsFor(cs.type, cs.t1, cs.t2); cs.period = pf?.text || ''; cs.pt = pf?.token || ''; }

    }
    sh.addEventListener('change', () => { keep(); draw(); });
    sh.addEventListener('click', (ev) => {
      const b = ev.target.closest('button, input[type=checkbox]');
      if (!b) return;
      keep();
      if (b.dataset.type) { present = b.dataset.type === '출석'; if (!present) { cs.type = b.dataset.type; if (cs.type !== '결석') { cs.from = cs.to = old ? cs.from : day; if (cs.sub === '교외체험학습') cs.sub = ''; if (!cs.t1 && day === ymdOf(new Date())) cs.t1 = nowHM(); if (cs.t1) { const pf = periodsFor(cs.type, cs.t1, cs.t2); cs.period = pf?.text || ''; cs.pt = pf?.token || ''; } } } }
      if (b.dataset.kind) { cs.kind = b.dataset.kind; if (cs.kind !== '출석인정') cs.sub = ''; else if (!cs.sub) cs.sub = '생리'; }

      if (b.id === 'dsClose') { close(); return; }
      if (b.id === 'dsSave') {
        if (present) {
          if (old) { unplace(old, true); delete S.cases[old.id]; }
          save(true); close(); renderCheck(); toast('출석으로 바꿨어요'); return;
        }
        if (cs.kind === '기타' && cs.type === '결석' && !cs.reason) { toast('기타결석은 사유를 꼭 적어야 해요'); return; }
        if (cs.type !== '결석') cs.from = cs.to = cs.from || day;
        if (!weekdays(cs.from, cs.to).length) { toast('기간에 평일이 없어요'); return; }
        S.cases[cs.id] = cs;
        place(cs);
        save(true); close(); renderCheck();
        toast(isTrip(cs) && tripDays(cs) + weekdays(cs.from, cs.to).length > S.cfg.tripMax ? `저장했어요 — 교외체험학습이 ${S.cfg.tripMax}일을 넘어요` : '저장했어요');
        return;
      }
      draw();
    });
    draw();
  }

  // ── 출석 ──────────────────────────────────────────────
  function renderCheck() {
    const main = $('#main');
    if (!S.classes.length) {
      main.innerHTML = `<div class="card empty"><b>먼저 내 수업 반을 추가해 주세요</b>반 이름과 학생 명단(번호·이름)만 있으면 돼요.<div class="row"><button class="btn main" id="goSetup">반 추가하기</button></div></div>`;
      return;
    }
    if (!cls()) S.ui.classId = S.classes[0].id;
    const c = cls();
    if (isHome(c)) { renderHome(c); return; }
    const rec = S.marks[key()] || {};
    const pirs = [1, 2, 3, 4, 5, 6, 7, 8];
    main.innerHTML = `
      <div class="card">
        <h2 class="sec">${esc(c.name)} ${S.ui.pir}교시${c.subject ? ` <span class="dim" style="font-weight:500;font-size:14px">${esc(c.subject)}</span>` : ''}</h2>
        <div class="sub" style="margin-top:0">교시</div>
        <div class="chips" id="pirChips">${pirs.map((p) => `<button class="chip ${p === S.ui.pir ? 'on' : ''}" data-pir="${p}">${p}</button>`).join('')}</div>
        <div class="sub">반</div>
        <div class="chips" id="clsChips">${S.classes.map((x) => `<button class="chip ${x.id === c.id ? 'on' : ''}" data-cls="${x.id}">${esc(x.name)}${x.subject ? `<small>${esc(x.subject)}</small>` : ''}</button>`).join('')}</div>
      </div>
      <div class="card">
        <div class="grid" id="stuGrid">${c.students.map((s) => tile(s, rec[s.no])).join('')}</div>
        <div class="sumbar"><div class="legend"><span class="l-res">결과</span><span class="l-rec">출석인정</span></div><div id="sum"></div></div>
        <p class="hint">누를 때마다 출석 → 결과(/) → 출석인정(Ø). 길게 누르면 사유를 적어요.</p>
      </div>`;
    paintSum();
  }
  function tile(s, e) {
    const m = e?.m || '';
    const klass = m === '/' ? 'res' : m === 'Ø' ? 'rec' : '';
    return `<button class="stu ${klass} ${e?.r ? 'has-r' : ''}" data-no="${esc(s.no)}"><i>${m}</i><b>${esc(s.no)}</b><span>${esc(s.name)}</span></button>`;
  }
  function paintSum() {
    const rec = S.marks[key()] || {};
    const vals = Object.values(rec);
    const n = (m) => vals.filter((e) => e.m === m).length;
    const el = $('#sum');
    if (el) el.innerHTML = `결과 <b>${n('/')}</b> · 인정 <b>${n('Ø')}</b>`;
  }
  function setMark(no, m, r) {
    const k = key();
    const rec = S.marks[k] || (S.marks[k] = {});
    const prev = rec[no] || { m: '', r: '' };
    rec[no] = { m, r: r !== undefined ? r : (m === '' ? '' : prev.r), t: Date.now() };
    save();
    const s = cls().students.find((x) => x.no === no);
    const btn = $(`#stuGrid [data-no="${CSS.escape(no)}"]`);
    if (btn && s) btn.outerHTML = tile(s, rec[no]);
    paintSum();
  }

  // 누르기: 한 번 = 다음 표시, 길게 = 사유 시트
  let pressTimer = null, longPressed = false;
  $('#main').addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.stu');
    if (!b) return;
    longPressed = false;
    if (isHome(cls())) return; // 담임 모드는 한 번 누르면 바로 입력 창
    pressTimer = setTimeout(() => { longPressed = true; openSheet(b.dataset.no); }, 480);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((t) => $('#main').addEventListener(t, () => clearTimeout(pressTimer)));
  $('#main').addEventListener('contextmenu', (e) => { if (e.target.closest('.stu')) e.preventDefault(); });
  $('#main').addEventListener('click', (e) => {
    const b = e.target.closest('.stu');
    if (b) {
      if (longPressed) return;
      if (isHome(cls())) { openDaySheet(b.dataset.no); return; }
      const cur = (S.marks[key()] || {})[b.dataset.no]?.m || '';
      setMark(b.dataset.no, cur === '' ? '/' : cur === '/' ? 'Ø' : '');
      return;
    }
    const p = e.target.closest('[data-pir]');
    if (p) { S.ui.pir = +p.dataset.pir; save(); renderCheck(); return; }
    const c = e.target.closest('[data-cls]');
    if (c) { S.ui.classId = c.dataset.cls; save(); renderCheck(); return; }
    if (e.target.id === 'goSetup') switchTab('setup');
  });

  // 전화·문자: 폰의 전화·문자 앱을 연다(이 앱은 아무 데도 보내지 않음)
  const telOf = (p) => String(p || '').replace(/[^\d+]/g, '');
  const showTel = (p) => { const d = telOf(p); return /^010\d{8}$/.test(d) ? `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}` : d; };
  function contactRow(who, phone) {
    const t = telOf(phone);
    if (!t) return '';
    return `<div class="contact"><span>${who} <b>${esc(showTel(t))}</b></span><a class="btn small" href="tel:${t}" target="_top">전화</a><a class="btn small" href="sms:${t}" target="_top">문자</a></div>`;
  }
  // 연락처 칸(이 폰에만): phone 학생, parent 주 보호자 전화, addr 주소, g 보호자 [{rel, tel}], main 주 연락처(g의 몇 번째)
  const CONTACT_KEYS = ['phone', 'parent', 'addr', 'g', 'main'];
  const keepContacts = (s, o) => { if (o) for (const k of CONTACT_KEYS) if (o[k] !== undefined) s[k] = o[k]; return s; };
  const hasContact = (s) => !!(s.phone || s.parent || s.addr || (s.g && s.g.length));
  function guardians(s) {
    if (s.g && s.g.length) return s.g.map((g, i) => ({ ...g, main: i === (s.main || 0) })).sort((a, b) => b.main - a.main);
    return s.parent ? [{ rel: '보호자', tel: s.parent, main: true }] : [];
  }
  function contactsHtml(s, c) {
    if (!c || !hasContact(s)) return '';
    const gs = guardians(s);
    return `${contactRow('학생', s.phone)}${gs.map((g) => contactRow(`${esc(g.rel || '보호자')}${g.main && gs.length > 1 ? '(주)' : ''}`, g.tel)).join('')}
      ${s.addr ? `<p class="hint" style="margin:8px 0 0">주소 ${esc(s.addr)}</p>` : ''}
      <div class="row" style="margin-top:8px"><button class="btn small" data-vcf="${esc(c.id)}|${esc(s.no)}">폰 연락처에 추가</button></div>`;
  }
  // 폰 연락처에 추가: vCard 파일을 만들어 폰의 연락처 앱이 받게 한다(이 앱은 아무 데도 보내지 않음)
  function vcards(c, list) {
    const v = (x) => String(x || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, ' ');
    const out = [];
    for (const s of list) {
      const org = `${c.name} ${s.no}번`;
      const card = (fn, tel) => ['BEGIN:VCARD', 'VERSION:3.0', `FN:${v(fn)}`, `N:${v(fn)};;;;`, `TEL;TYPE=CELL:${tel}`, s.addr ? `ADR;TYPE=HOME:;;${v(s.addr)};;;;` : '', `ORG:${v(org)}`, 'END:VCARD'].filter(Boolean).join('\r\n');
      if (telOf(s.phone)) out.push(card(`${s.name} 학생`, telOf(s.phone)));
      for (const g of guardians(s)) if (telOf(g.tel)) out.push(card(`${s.name} ${g.rel || '보호자'}${g.main ? '(주)' : ''}`, telOf(g.tel)));
    }
    return out.join('\r\n');
  }
  async function saveVcf(text, name) {
    if (!text) { toast('연락처가 없어요'); return; }
    const file = new File([text + '\r\n'], name, { type: 'text/vcard' });
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
    const url = URL.createObjectURL(file);
    if (ios) { location.href = url; setTimeout(() => URL.revokeObjectURL(url), 60000); return; }
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); URL.revokeObjectURL(url); return; } catch (e) { if (e.name === 'AbortError') { URL.revokeObjectURL(url); return; } }
    }
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-vcf]');
    if (!b) return;
    const [cid, no] = b.dataset.vcf.split('|');
    const c = S.classes.find((x) => x.id === cid);
    const list = c ? (no ? c.students.filter((x) => x.no === no) : c.students.filter(hasContact)) : [];
    if (!list.length) { toast('연락처가 없어요'); return; }
    saveVcf(vcards(c, list), no ? `${c.name}_${no}번.vcf` : `${c.name}_연락처.vcf`);
  });

  function openSheet(no) {
    const s = cls().students.find((x) => x.no === no);
    const e = (S.marks[key()] || {})[no] || { m: '', r: '' };
    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    const sh = document.createElement('div');
    sh.className = 'sheet';
    sh.innerHTML = `
      <h3>${esc(s.no)}번 ${esc(s.name)}</h3>
      <div class="dim" style="font-size:13px">${esc(showDay(day))} ${S.ui.pir}교시 · ${esc(cls().name)}</div>
      <div class="marks">${Object.entries(MARK).map(([m, l]) => `<button data-m="${m}" class="${e.m === m ? 'on' : ''}">${l}</button>`).join('')}</div>
      <label class="field"><span>사유</span><input id="shReason" maxlength="100" value="${esc(e.r)}" placeholder="예: 병원 진료"></label>
      <div class="reasons">${REASONS.map((r) => `<button data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div>
      ${contactsHtml(s, cls())}
      <div class="row"><button class="btn" id="shClose">닫기</button><button class="btn main" id="shSave">저장</button></div>`;
    document.body.append(bg, sh);
    let m = e.m || '/';
    sh.querySelectorAll('.marks button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
    const close = () => { bg.remove(); sh.remove(); };
    bg.addEventListener('click', close);
    sh.addEventListener('click', (ev) => {
      const mb = ev.target.closest('[data-m]');
      if (mb) { m = mb.dataset.m; sh.querySelectorAll('.marks button').forEach((b) => b.classList.toggle('on', b.dataset.m === m)); return; }
      const rb = ev.target.closest('[data-r]');
      if (rb) { $('#shReason', sh).value = rb.dataset.r; if (m === '') { m = '/'; sh.querySelectorAll('.marks button').forEach((b) => b.classList.toggle('on', b.dataset.m === m)); } return; }
      if (ev.target.id === 'shClose') close();
      if (ev.target.id === 'shSave') { setMark(no, m, m === '' ? '' : $('#shReason', sh).value.trim()); close(); toast('저장했어요'); }
    });
  }

  // ── 서류: 사안마다 필요 서류·제출 체크·기한, 교외체험학습 누적 ──
  let docsAll = false;
  function renderDocs() {
    const today = ymdOf(new Date());
    const stu = (cs) => S.classes.find((c) => c.id === cs.classId)?.students.find((s) => s.no === cs.no);
    const list = Object.values(S.cases).filter((cs) => S.classes.some((c) => c.id === cs.classId) && docsFor(cs).length)
      .map((cs) => ({ cs, st: docState(cs), due: addDays(cs.to, +S.cfg.deadline || 7) }))
      .filter((x) => docsAll || x.st.miss.length)
      .sort((a, b) => (a.st.miss.length ? 0 : 1) - (b.st.miss.length ? 0 : 1) || a.due.localeCompare(b.due));
    const trips = {};
    for (const cs of Object.values(S.cases)) {
      if (!isTrip(cs) || schoolYear(cs.from) !== schoolYear(today)) continue;
      const k = `${cs.classId}|${cs.no}`;
      trips[k] = (trips[k] || 0) + weekdays(cs.from, cs.to).length;
    }
    const range = (cs) => (cs.from === cs.to ? showDay(cs.from) : `${showDay(cs.from)} ~ ${showDay(cs.to)}`);
    const dueBadge = (x) => (!x.st.miss.length ? '<span class="badge ok">제출 완료</span>'
      : x.due < today ? `<span class="badge late">기한 지남 (${+x.due.slice(4, 6)}/${+x.due.slice(6)})</span>`
        : `<span class="badge">D-${Math.round((dateOf(x.due) - dateOf(today)) / 86400000)}</span>`);
    $('#main').innerHTML = `
      <div class="card">
        <h2 class="sec">받아야 할 서류</h2>
        <div class="chips"><button class="chip ${docsAll ? '' : 'on'}" data-docs="miss">미제출만</button><button class="chip ${docsAll ? 'on' : ''}" data-docs="all">전체</button></div>
        ${list.length ? list.map((x) => {
          const s = stu(x.cs);
          const cname = S.classes.find((c) => c.id === x.cs.classId)?.name || '';
          return `<div style="margin-top:14px">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px"><b>${esc(cname)} ${esc(x.cs.no)}번 ${esc(s?.name || '')}</b>${dueBadge(x)}</div>
            <div class="dim" style="font-size:13px">${esc(range(x.cs))} · ${esc(labelOf(x.cs))}${x.cs.sub ? ` · ${esc(x.cs.sub)}` : ''}${x.cs.reason ? ` · ${esc(x.cs.reason)}` : ''}</div>
            <ul class="docs">${x.st.need.map((d) => (d === 'photo'
              ? `<li class="${(x.cs.docs.photo || 0) >= x.st.days ? 'done' : ''}"><span>${DOC[d]}</span><div class="cnt"><button data-case="${x.cs.id}" data-ph="-1">−</button><b>${x.cs.docs.photo || 0}/${x.st.days}</b><button data-case="${x.cs.id}" data-ph="1">+</button></div></li>`
              : `<li class="${x.cs.docs[d] ? 'done' : ''}"><input type="checkbox" data-case="${x.cs.id}" data-doc="${d}" ${x.cs.docs[d] ? 'checked' : ''}><span>${DOC[d]}</span></li>`)).join('')}</ul>
            ${x.st.miss.length && S.cfg.sf ? reqHtml(x.cs) : ''}
          </div>`;
        }).join('') : `<p class="empty" style="padding:16px">${docsAll ? '서류가 필요한 기록이 없어요.' : '받아야 할 서류가 모두 들어왔어요.'}</p>`}
      </div>
      <div class="card">
        <h2 class="sec">교외체험학습 누적 (올해)</h2>
        ${Object.keys(trips).length ? `<table class="list"><thead><tr><th>반</th><th class="c">번호</th><th>이름</th><th class="c">일수</th></tr></thead><tbody>${Object.entries(trips).map(([k, n]) => {
          const [cid, no] = k.split('|');
          const c = S.classes.find((x) => x.id === cid);
          const s = c?.students.find((x) => x.no === no);
          return `<tr><td>${esc(c?.name || '')}</td><td class="c">${esc(no)}</td><td>${esc(s?.name || '')}</td><td class="c" style="${n > S.cfg.tripMax ? 'color:var(--res);font-weight:700' : ''}">${n} / ${S.cfg.tripMax}</td></tr>`;
        }).join('')}</tbody></table>` : '<p class="hint">올해 교외체험학습 기록이 없어요.</p>'}
      </div>
      <div class="card">
        <h2 class="sec">서류 설정</h2>
        <div class="row">
          <label class="field" style="flex:1;margin:0"><span>제출 기한 (끝난 날부터, 일)</span><input type="number" min="1" max="60" id="cfgDeadline" value="${+S.cfg.deadline || 7}"></label>
          <label class="field" style="flex:1;margin:0"><span>체험학습 최대 (일)</span><input type="number" min="1" max="60" id="cfgTrip" value="${+S.cfg.tripMax || 15}"></label>
        </div>
      </div>
      <div class="card">
        <h2 class="sec">서류 규칙 <span class="dim" style="font-size:13px;font-weight:500">— 학교에 맞게 눌러서 바꾸세요</span></h2>
        <table class="list"><tbody>${RULE_ROWS.map(([k, label]) => `<tr><td style="width:38%;font-weight:600">${esc(label)}</td><td><div class="chips" style="flex-wrap:wrap">${Object.entries(DOC).map(([d, name]) => `<button class="chip ${(rules()[k] || []).includes(d) ? 'on' : ''}" style="height:30px;font-size:12px;padding:0 8px" data-rule="${k}" data-rdoc="${d}">${esc(name.split(' (')[0])}</button>`).join('')}</div></td></tr>`).join('')}</tbody></table>
        <div class="row"><button class="btn small" id="rulesReset">처음 규칙으로 되돌리기</button></div>
      </div>`;
  }
  $('#main').addEventListener('click', (e) => {
    if (tab !== 'docs') return;
    const f = e.target.closest('[data-docs]');
    if (f) { docsAll = f.dataset.docs === 'all'; renderDocs(); return; }
    const rb = e.target.closest('[data-rule]');
    if (rb) {
      const cur = { ...rules() };
      const list = new Set(cur[rb.dataset.rule] || []);
      list.has(rb.dataset.rdoc) ? list.delete(rb.dataset.rdoc) : list.add(rb.dataset.rdoc);
      cur[rb.dataset.rule] = Object.keys(DOC).filter((d) => list.has(d));
      S.cfg.rules = cur;
      save(true);
      renderDocs();
      return;
    }
    if (e.target.id === 'rulesReset' && confirm('서류 규칙을 처음 값으로 되돌릴까요?')) { delete S.cfg.rules; save(true); renderDocs(); return; }
    const rq = e.target.closest('[data-sfreq]');
    if (rq) { if (!sfWake()) return; requestDoc(S.cases[rq.dataset.sfreq]).then(() => { if (tab === 'docs') renderDocs(); }); return; }
    const b = e.target.closest('[data-case]');
    if (!b) return;
    const cs = S.cases[b.dataset.case];
    if (!cs) return;
    if (b.dataset.doc) cs.docs[b.dataset.doc] = b.checked;
    if (b.dataset.ph) cs.docs.photo = Math.max(0, Math.min(docState(cs).days, (cs.docs.photo || 0) + +b.dataset.ph));
    save(true);
    renderDocs();
  });
  $('#main').addEventListener('change', (e) => {
    if (tab !== 'docs') return;
    if (e.target.id === 'cfgDeadline') S.cfg.deadline = Math.max(1, Math.min(60, +e.target.value || 7));
    if (e.target.id === 'cfgTrip') S.cfg.tripMax = Math.max(1, Math.min(60, +e.target.value || 15));
    save(true);
    renderDocs();
  });

  // ── 내보내기 ──────────────────────────────────────────
  let exp = { from: '', to: '' };
  const monthRange = (ymd) => ({ from: `${ymd.slice(0, 6)}01`, to: ymdOf(new Date(+ymd.slice(0, 4), +ymd.slice(4, 6), 0)) });
  // 지금 고른 기간이 어느 버튼과 같은지(버튼 표시용)
  const rangeIs = (k) => { const m = monthRange(day), w = weekRange(day); return k === 'today' ? exp.from === day && exp.to === day : k === 'week' ? exp.from === w[0] && exp.to === w[1] : exp.from === m.from && exp.to === m.to; };
  function weekRange(ymd) {
    const d = dateOf(ymd);
    const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
    return [ymdOf(mon), ymdOf(fri)];
  }
  function exportRows(from, to) {
    const out = [];
    for (const [k, rec] of Object.entries(S.marks)) {
      const [ymd, pir, cid] = k.split('|');
      if (ymd < from || ymd > to) continue;
      const c = S.classes.find((x) => x.id === cid);
      if (!c) continue;
      for (const [no, e] of Object.entries(rec)) {
        const s = c.students.find((x) => x.no === no);
        if (!s) continue;
        out.push({ ymd, pir: +pir, cls: c.name, no: +no, name: s.name, mark: MARK[e.m] ?? '출석', reason: e.r || '' });
      }
    }
    return out.sort((a, b) => a.ymd.localeCompare(b.ymd) || a.pir - b.pir || a.cls.localeCompare(b.cls, 'ko', { numeric: true }) || a.no - b.no);
  }
  function renderExport() {
    if (!exp.from) exp = { from: day, to: day }; // 기본은 오늘(교사 결정 2026-10-28) — 이번 주·이번 달·날짜 범위는 위 [기간]에서
    const rows = exportRows(exp.from, exp.to);
    const marked = rows.filter((r) => r.mark !== '출석');
    const byDay = {};
    rows.forEach((r) => { (byDay[r.ymd] = byDay[r.ymd] || []).push(r); });
    const drows = dailyRows(exp.from, exp.to);
    $('#main').innerHTML = `
      <div class="card">
        <h2 class="sec">기간</h2>
        <div class="chips">
          <button class="chip ${rangeIs('today') ? 'on' : ''}" data-range="today">오늘</button>
          <button class="chip ${rangeIs('week') ? 'on' : ''}" data-range="week">이번 주</button>
          <button class="chip ${rangeIs('month') ? 'on' : ''}" data-range="month">이번 달</button>
        </div>
        <div class="row">
          <label class="field" style="flex:1;margin:0"><span>시작</span><input type="date" id="exFrom" value="${isoOf(exp.from)}"></label>
          <label class="field" style="flex:1;margin:0"><span>끝</span><input type="date" id="exTo" value="${isoOf(exp.to)}"></label>
        </div>
        <p class="hint dim">날짜를 하나만 보내려면 시작과 끝을 같은 날로 고르세요. 아래 파일은 이 기간으로 만들어요.</p>
      </div>

  // ── 명단 파일(업무 도우미가 나이스에서 번호·이름만 뽑은 것) ──
  function importRoster(data) {
    if (!data || data.kind !== 'chulseokbu-roster' || !Array.isArray(data.classes)) throw new Error('업무 도우미의 출석부 명단 파일이 아니에요.');
    let added = 0, updated = 0;
    for (const c of data.classes) {
      const name = normClass(c.name);
      const students = (c.students || []).filter((s) => s && /^\d+$/.test(String(s.no)) && s.name).map((s) => ({ no: String(+s.no), name: String(s.name).replace(/\s+/g, '') }));
      if (!name || !students.length) continue;
      const subject = String(c.subject || '').slice(0, 20);
      const old = S.classes.find((x) => x.name === name && (x.subject || '') === subject);
      if (old) {
        old.students = students.map((s) => keepContacts({ ...s }, old.students.find((x) => x.no === s.no && x.name === s.name)));
        updated++;
      } else { S.classes.push({ id: uid(), name, subject, students }); added++; }
    }
    S.classes.sort((a, b) => a.name.localeCompare(b.name, 'ko', { numeric: true }));
    if (!S.ui.classId && S.classes[0]) S.ui.classId = S.classes[0].id;
    save(true);
    return `반 ${added}개 추가, ${updated}개 새 명단으로 바꿈`;
  }

  // ── 업무 도우미가 만든 링크(#cb=…): 나이스 명단(번호·이름)이 든 채로 열린다 ──
  // '#' 뒤는 서버(깃허브)로 가지 않는다. 넣은 뒤에는 주소 뒤쪽을 '지금 이 폰의 전체 명단'으로 바꿔 둔다
  // → 그 주소로 홈 화면에 추가하면, 홈 화면 앱이 따로 저장 공간을 써도 처음 열 때 명단이 들어간다.
  const b64u = (u8) => { let b = ''; for (const x of u8) b += String.fromCharCode(x); return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64u = (s) => { s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - (s.length % 4)) % 4); return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); };
  const squeeze = async (u8, how) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(how)).arrayBuffer());
  const linkKey = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return `${s.length}.${h >>> 0}`; };
  function rosterText(classes) {
    return ['v1', ...classes.flatMap((c) => [`@${c.name}|${c.subject || ''}`, ...c.students.map((s) => `${s.no} ${s.name}`)])].join('\n');
  }
  function parseRosterText(text) {
    const lines = text.split('\n');
    if (lines[0] !== 'v1') throw new Error('도우미 링크 모양이 달라요. 도우미에서 다시 만들어 주세요.');
    const classes = [];
    for (const l of lines.slice(1)) {
      if (l.startsWith('@')) { const [name, subject] = l.slice(1).split('|'); classes.push({ name, subject: subject || '', students: [] }); continue; }
      const m = /^(\d+) (.+)$/.exec(l);
      if (m && classes.length) classes[classes.length - 1].students.push({ no: m[1], name: m[2] });
    }
    return classes;
  }
  async function rosterFromLink() {
    const m = /^#cb=([A-Za-z0-9_-]+)(?:&sf=([A-Za-z0-9_-]+))?(?:&sy=([A-Za-z0-9_.-]+))?$/.exec(location.hash);
    if (!m || typeof DecompressionStream === 'undefined') return '';
    // sy: 구글 자동 저장 열쇠 — 홈 화면 아이콘 주소에도 남겨 둔다(아이폰 홈 화면 앱은 저장 공간이 따로라 처음 열 때 다시 연결)
    const sfPart = (m[2] ? `&sf=${m[2]}` : '') + (m[3] ? `&sy=${m[3]}` : '');
    if (m[3]) SY.linked = m[3];
    if (m[2]) sfApply(m[2]); // 업무 도우미가 만든 학생 서류 받는 곳 → [서류함] 저절로 연결
    const key = linkKey(m[1]);
    if (S.ui.link === key) return '';
    const text = new TextDecoder().decode(await squeeze(unb64u(m[1]), new DecompressionStream('deflate-raw')));
    const got = parseRosterText(text);
    importRoster({ kind: 'chulseokbu-roster', classes: got });
    const msg = `반 ${got.length}개 · 학생 ${got.reduce((n, c) => n + c.students.length, 0)}명`;
    try {
      const all = b64u(await squeeze(new TextEncoder().encode(rosterText(S.classes)), new CompressionStream('deflate-raw')));
      history.replaceState(null, '', `${location.pathname}${location.search}#cb=${all}${sfPart}`);
      S.ui.link = linkKey(all);
    } catch { S.ui.link = key; }
    save(true);
    return msg;
  }

  // ── 홈 화면에 추가 안내(앱처럼 쓰기) ───────────────────
  const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  function homeGuide() {
    const ua = navigator.userAgent;
    if (/KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua)) return '지금은 앱 안 브라우저예요. 오른쪽 아래(또는 위) ⋮·공유 → <b>Safari로 열기 / 다른 브라우저로 열기</b>를 누른 뒤 홈 화면에 추가하세요.';
    if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'Safari 아래쪽 <b>공유(□↑)</b> → <b>홈 화면에 추가</b> → 추가.';

  function showHomeSheet(msg) {

  // ── 연락처(표 → 학생에 붙이기) ─────────────────────────
  const contactCount = () => S.classes.reduce((n, c) => n + c.students.filter(hasContact).length, 0);
  function applyContacts(rows) {
    rows = rows.filter((r) => r.some((x) => String(x).trim()));
    if (rows.length < 2) throw new Error('표에 내용이 없어요.');
    const head = rows[0].map((h) => String(h).replace(/\s+/g, ''));
    const find = (re) => head.findIndex((h) => re.test(h));
    const iCls = find(/^(반|학반|학급)$/), iNo = find(/^(번호|번|학번)$/), iName = find(/^(이름|성명|학생명|학생|학생이름)$/);
    // 연락처 폼(구글 설문지) 응답 칸: 동의 · 주소 · 보호자1·2 관계/휴대전화 · 주 연락처
    const iAgree = find(/동의/), iAddr = find(/^주소$/), iMain = find(/^주연락처$/);
    const gCols = [1, 2].map((n) => ({ n, rel: find(new RegExp(`^보호자${n}관계$`)), tel: find(new RegExp(`^보호자${n}(휴대전화|전화|연락처|휴대폰)$`)) })).filter((x) => x.tel >= 0);
    const used = new Set([iAgree, iAddr, iMain, ...gCols.flatMap((x) => [x.rel, x.tel])]);
    const iParent = head.findIndex((h, i) => !used.has(i) && /보호자|학부모|부모|어머니|아버지|모$|부$/.test(h));
    const iPhone = head.findIndex((h, i) => !used.has(i) && i !== iParent && /(학생.*(연락|전화|폰|휴대))|^(연락처|전화번호|휴대폰|핸드폰|휴대전화)$/.test(h));
    if (iNo < 0 && iName < 0) throw new Error('번호나 이름 칸을 찾지 못했어요. 첫 줄에 "번호, 이름, 학생 연락처, 보호자 연락처"처럼 적어 주세요.');
    if (iPhone < 0 && iParent < 0 && !gCols.length) throw new Error('연락처 칸을 찾지 못했어요. 첫 줄에 "학생 연락처", "보호자 연락처" 같은 이름을 적어 주세요.');
    let ok = 0;
    const miss = [];
    for (const r of rows.slice(1)) {
      if (iAgree >= 0 && !/동의합니다|^동의$|^예$/.test(String(r[iAgree] ?? '').trim())) continue; // 동의하지 않은 응답은 넣지 않음
      const raw = String(r[iNo] ?? '').replace(/\D/g, '');
      const no = raw.length >= 3 ? String(+raw.slice(-2)) : raw ? String(+raw) : '';
      const nm = String(r[iName] ?? '').replace(/\s+/g, '');
      const cn = iCls >= 0 ? normClass(r[iCls]) : raw.length >= 4 ? normClass(raw.length === 5 ? `${raw[0]}-${raw.slice(1, 3)}` : `${raw[0]}-${raw[1]}`) : '';
      const pool = cn ? S.classes.filter((c) => c.name === cn) : [cls()].filter(Boolean);
      const hits = pool.flatMap((c) => c.students).filter((s) => (!no || s.no === no) && (!nm || s.name === nm));
      if (hits.length === 0) { miss.push(`${cn || ''} ${no}${nm ? ` ${nm}` : ''}`.trim()); continue; }
      for (const s of hits) {
        if (iPhone >= 0 && telOf(r[iPhone])) s.phone = telOf(r[iPhone]);
        if (iParent >= 0 && telOf(r[iParent])) s.parent = telOf(r[iParent]);
        if (iAddr >= 0 && String(r[iAddr] ?? '').trim()) s.addr = String(r[iAddr]).trim().slice(0, 120);
        const gs = gCols.map((x) => ({ n: x.n, rel: x.rel >= 0 ? String(r[x.rel] ?? '').trim().slice(0, 10) : '', tel: telOf(r[x.tel]) })).filter((x) => x.tel);
        if (gs.length) {

  // 아주 작은 표 읽기: xlsx(첫 시트) / csv
  async function readTable(file) {
    if (/\.xlsx$/i.test(file.name)) return readXlsx(await file.arrayBuffer());
    const buf = new Uint8Array(await file.arrayBuffer());

    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch { text = new TextDecoder('euc-kr').decode(buf); }

  }
  function csvSplit(line) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }

  async function readXlsx(ab) {
    const u8 = new Uint8Array(ab), dv = new DataView(ab);

    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('엑셀 파일이 아니거나 손상됐어요.');
    const files = new Map();

    for (let n = dv.getUint16(eocd + 10, true); n > 0 && dv.getUint32(p, true) === 0x02014b50; n--) {

    }
    const txt = async (name) => {
      const f = files.get(name);
      if (!f) return '';

      const s = new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));

    };
    const un = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d)).replace(/&amp;/g, '&');

    const shared = [...(await txt('xl/sharedStrings.xml')).matchAll(/<si>([\s\S]*?)<\/si>/g)].map((m) => ts(m[1]));
    const sheetName = [...files.keys()].filter((k) => /^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];
    const xml = await txt(sheetName || 'xl/worksheets/sheet1.xml');
    const col = (ref) => [...(/^[A-Z]+/.exec(ref) || ['A'])[0]].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1;
    return [...xml.matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)].map((rm) => {
      const cells = [];
      for (const cm of rm[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
        const tag = cm[1], body = cm[2] || '';
        const ref = (/\sr="([^"]+)"/.exec(tag) || [])[1], t = (/\st="([^"]+)"/.exec(tag) || [])[1];
        const v = (/<v>([\s\S]*?)<\/v>/.exec(body) || [])[1];
        cells[ref ? col(ref) : cells.length] = t === 's' ? shared[+v] ?? '' : t === 'inlineStr' ? ts(body) : un(v ?? '');

    });
  }

  // ── 구글 자동 저장 ───────────────────────────────────────
  // 선생님 구글 계정의 '출석부 저장소'(gas/sync-store, 만들기 다리가 만듦)에 출석부를 저절로 올리고 받는다.
  // 보내기 전에 이 기기에서 압축 + AES-GCM 암호화(열쇠 = sha256('key|'+t)) → 구글에는 알아볼 수 없는 글자만 남는다.
  // 기기마다 다른 것(ui: 고른 반·교시)은 보내지 않는다. 두 기기가 거의 동시에 고치면 나중에 고친 쪽을 남기고 다른 쪽은 이 기기에 보관
  const STORE_RE = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]{20,}\/exec$/;

  async function syncKeyOf(t) {
    const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`key|${t}`));
    return crypto.subtle.importKey('raw', d, 'AES-GCM', false, ['encrypt', 'decrypt']);

  async function seal(obj, t) {
    const z = await squeeze(new TextEncoder().encode(JSON.stringify(obj)), new CompressionStream('deflate-raw'));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await syncKeyOf(t), z));
    const all = new Uint8Array(iv.length + ct.length);
    all.set(iv); all.set(ct, iv.length);

  async function unseal(blob, t) {

  async function storeCall(body) {

  const SYNC_ERR = { auth: '구글 저장소 열쇠가 맞지 않아요. [구글 자동 저장 → 켜기]를 다시 눌러 주세요.', full: '구글 저장소가 가득 찼어요. 지난 학기 자료를 백업 받고 지워 주세요.' };

  function syncApply(box, rev) {

    const box = await unseal(r.blob, SY.conf.t);
    const mine = { v: 1, data: syncable(), editedAt: S.editedAt || 0 };
    if ((box.editedAt || 0) > (S.editedAt || 0)) {
      writeJson(`${KEY}.conflict`, { at: Date.now(), box: mine });

  async function syncPush({ force = false } = {}) {

    const data = syncable();
    const j = JSON.stringify(data);
    if (!force && j === SY.sent) { setMeta({ dirty: false }); paintSync(); return; }
    SY.busy = true;
    if (!S.editedAt) S.editedAt = Date.now(); // 자동 저장 전에 만든 자료
    const stamp = S.editedAt;
    try {
      const blob = await seal({ v: 1, data, editedAt: stamp }, SY.conf.t);
      const r = await storeCall({ a: 'put', base: SY.meta.rev, blob, at: stamp, force });
      if (r.ok) { SY.sent = j; SY.status = ''; setMeta({ rev: r.rev, dirty: S.editedAt !== stamp, at: Date.now() }); }
      else if (r.err === 'conflict') { SY.busy = false; await syncResolve(r); return; }

  async function syncPull() {

    let r;
    try { r = await storeCall({ a: 'get' }); }
    catch { SY.busy = false; SY.status = '구글 저장소에 닿지 못했어요 — 이 기기 자료로 계속해요'; paintSync(); return; }
    SY.busy = false;
    if (!r.ok) { SY.status = syncErr(r.err); paintSync(); return; }
    SY.status = '';
    try {
      if (r.rev > SY.meta.rev) {
        if (SY.meta.dirty) await syncResolve(r);
        else { syncApply(await unseal(r.blob, SY.conf.t), r.rev); toast('다른 기기에서 고친 출석부를 받았어요'); }
      } else if (SY.meta.dirty) await syncPush();
      else setMeta({ at: Date.now() });
    } catch (e) { SY.status = e.message; }
    paintSync();
  }
  // 켜기(만들기 다리에서 열쇠를 받음) / 다른 기기 QR·링크(#sy=…)
  async function syncConnect(conf) {
    if (!conf || !STORE_RE.test(String(conf.u)) || !/^[0-9a-f]{64}$/.test(String(conf.t))) throw new Error('구글 저장소 연결 정보 모양이 달라요.');
    const same = SY.conf && SY.conf.u === conf.u && SY.conf.t === conf.t;
    // 어느 계정 저장소인지(만들기 다리가 알려 준 계정 — QR·링크로 붙으면 모름) — PC·폰이 같은 저장소인지 견줘 보게(교사 2026-10-30: PC·폰이 안 맞춰짐)
    const email = /^[^\s@]+@[^\s@]+$/.test(String(conf.email || '')) ? String(conf.email).toLowerCase() : same ? SY.conf.email || '' : '';
    SY.conf = { u: conf.u, t: conf.t, ...(email ? { email } : {}) };
    writeJson(SYNC_KEY, SY.conf);
    if (!same) setMeta({ rev: 0, dirty: false, at: 0 });
    SY.status = '';
    paintSync();
    const r = await storeCall({ a: 'get' });
    if (!r.ok) throw new Error(syncErr(r.err));
    if (r.rev > 0 && r.rev !== SY.meta.rev) {
      const box = await unseal(r.blob, conf.t);
      const n = (box.data.classes || []).length;
      const mine = S.classes.length && (S.editedAt || 0) !== (box.editedAt || 0);
      if (!mine || confirm(`구글에 저장된 출석부가 있어요(반 ${n}개, ${hhmm(r.at || box.editedAt)} 저장).\n그 자료로 바꿀까요?\n[취소]를 누르면 이 기기 자료를 구글에 올려요.`)) {
        syncApply(box, r.rev);
        toast('구글에 저장된 출석부를 받았어요');
        return;
      }
      setMeta({ rev: r.rev });
    }
    if (S.classes.length) { await syncPush({ force: true }); toast('구글 자동 저장을 켰어요'); }
    else { setMeta({ rev: r.rev, at: Date.now() }); toast('구글 자동 저장을 켰어요'); }
    paintSync();
  }
  function syncOff() {
    SY.conf = null; SY.status = '';
    writeJson(SYNC_KEY, null); writeJson(SYNC_META, null);
    SY.meta = { rev: 0, dirty: false, at: 0 };
  }
  function makeStore() {
    if (!MAKER_URL) { toast('자동 저장이 아직 준비 중이에요.'); return; }
    // 구글 '계정 고르기' 화면은 Apps Script에 안 먹혀서(2026-10-29) 그 창 안에서 계정 번호로 고른다(설정한 계정이 있으면 authuser로)
    const acc = gAccount();
    const w = window.open(`${MAKER_URL}?${new URLSearchParams({ origin: location.origin, w: 'store', ...(APP === 'class' ? { app: 'class' } : {}), ...(acc ? { authuser: acc } : {}) })}`, 'chulseokbu-store-maker', 'width=460,height=600');
    if (!w) { toast('팝업이 막혔어요. 주소창의 팝업 허용을 누른 뒤 다시 해 주세요.'); return; }
    SY.making = true; SY.status = '';
    paintSync();
  }
  // 링크·QR의 열쇠: '배포ID.열쇠'(짧게 — QR이 덜 빽빽)
  const syShort = (c) => `${c.u.split('/s/')[1].split('/')[0]}.${c.t}`;
  const syncLink = () => `${location.origin}${location.pathname}${location.search}#sy=${syShort(SY.conf)}`;
  // 저장소 번호: 배포 ID 끝 5자리 — 같은 계정으로 켠 기기는 모두 같은 번호(계정마다 저장소 하나)
  const syTag = (c) => c.u.split('/s/')[1].split('/')[0].slice(-5);
  function syncCard() {
    const on = !!SY.conf;
    const st = SY.making ? '작은 창에서 계정을 확인하고 [이 계정에 켜기]를 눌러 주세요'
      : SY.status ? SY.status
        : !on ? '' : SY.busy ? '구글과 맞추는 중…' : SY.meta.dirty ? '저장 대기' : SY.meta.at ? `저장됨 · ${hhmm(SY.meta.at)}` : '켜짐';
    const bad = !!SY.status && !/대기/.test(SY.status);
    const back = readJson(`${KEY}.conflict`);
    return `<div class="card" id="syncCard">
        <h2 class="sec">구글 자동 저장</h2>
        ${on ? `<p class="hint"><b class="${bad ? 'sy-bad' : 'sy-ok'}">${esc(st)}</b></p>
          <p class="hint sy-tag">저장소 번호 <b>${esc(syTag(SY.conf))}</b>${SY.conf.email ? ` · ${esc(SY.conf.email)}${/@gmail\.com$/i.test(SY.conf.email) ? ' <b class="sy-bad">(개인 계정)</b>' : ''}` : ''}</p>
          <p class="hint dim">PC와 폰에서 이 <b>저장소 번호</b>가 같아야 서로 맞춰져요. 다르면 맞는 기기에서 [다른 기기 연결 QR]을 띄워 다른 기기로 찍거나, 그 기기에서 [이 기기에서 끄기] 뒤 같은 교육청 계정으로 [켜기]를 눌러 주세요.</p>
          <p class="hint dim">출결을 누르면 몇 초 뒤 선생님 구글 계정의 출석부 저장소에 저절로 저장되고, 같은 계정으로 켠 다른 기기(폰·PC)가 받아 가요. 이 기기에서 암호로 잠근 뒤 보내요.</p>
          <div class="row"><button class="btn small" id="syNow">지금 맞추기</button><button class="btn small" id="syQr">다른 기기 연결 QR</button><button class="btn small" id="syOff">이 기기에서 끄기</button></div>
          <div id="syQrBox"></div>
          <details><summary class="hint">더 보기</summary>
            ${back ? `<p class="hint">겹쳐서 바뀌기 전 자료(${hhmm(back.at)}) <button class="textbtn" id="syBack">그 자료로 되돌리기</button></p>` : ''}
            <p class="hint">구글에 저장된 이 출석부를 지우려면 <button class="textbtn danger" id="syWipe">구글에 저장된 출석부 지우기</button> (이 기기 자료는 그대로)</p>
          </details>`
        : `<p class="hint">폰을 바꾸거나 PC에서 열어도 같은 출석부가 보이게, 선생님 <b>교육청 구글 계정</b>에 저절로 저장해요. 이 기기에서 암호로 잠근 뒤 보내서 구글에는 알아볼 수 없는 글자로만 남아요.</p>
          ${st ? `<p class="hint"><b class="${bad ? 'sy-bad' : 'sy-ok'}">${esc(st)}</b></p>` : ''}
          <div class="row"><button class="btn small main" id="syOn">켜기</button></div>
          <p class="hint dim">처음 한 번 작은 창에서 학교 구글 계정을 확인하고 [이 계정에 켜기]를 누르면 돼요. 다른 기기도 같은 계정으로 [켜기]만 누르면 같은 출석부가 들어와요.</p>`}
      </div>`;
  }
  function paintSync() {
    const c = document.getElementById('syncCard');
    if (c) c.outerHTML = syncCard();
  }
  document.addEventListener('click', async (e) => {
    const id = e.target.id;
    if (id === 'syOn') { makeStore(); return; }
    if (id === 'syNow') { await syncPull(); if (SY.meta.dirty) await syncPush(); paintSync(); return; }
    if (id === 'syQr') {
      const box = $('#syQrBox');
      if (box.innerHTML) { box.innerHTML = ''; return; }
      try { box.innerHTML = `${await qrImg(syncLink(), '다른 기기 연결 QR', 240)}<p class="hint">선생님의 다른 기기 카메라로 찍으면 같은 출석부가 들어와요. 이 QR에는 출석부 열쇠가 들어 있어요 — 다른 사람에게 보여 주지 마세요.</p>`; }
      catch { box.textContent = 'QR을 그리지 못했어요.'; }
      return;
    }
    if (id === 'syOff' && confirm('이 기기에서 구글 자동 저장을 끌까요? 구글에 저장된 출석부와 이 기기 자료는 그대로 있어요.')) { syncOff(); renderSetup(); return; }
    if (id === 'syWipe' && confirm('구글에 저장된 이 출석부를 지울까요? 다른 기기도 더는 받아 가지 못해요(각 기기 안의 자료는 그대로).')) {
      try { const r = await storeCall({ a: 'wipe' }); if (!r.ok) throw new Error(syncErr(r.err)); setMeta({ rev: 0, dirty: false }); toast('구글에 저장된 출석부를 지웠어요'); }
      catch (err) { toast(err.message); }
      renderSetup();
      return;
    }
    if (id === 'syBack') {
      const back = readJson(`${KEY}.conflict`);
      if (!back || !confirm('겹쳐서 바뀌기 전 자료로 되돌릴까요? 지금 자료는 덮어써져요.')) return;
      const ui = S.ui;
      S = { ...blank(), ...back.box.data, cfg: { ...blank().cfg, ...(back.box.data.cfg || {}) }, ui };
      writeJson(`${KEY}.conflict`, null);
      save(true);
      toast('되돌렸어요');
      renderSetup();
    }
  });
  // 다른 기기 QR·만들기 창에서 돌아온 링크(#sy=…)
  function syFromLink() {
    const m = /^#sy=([A-Za-z0-9_.-]+)$/.exec(location.hash);
    if (!m) return '';
    history.replaceState(null, '', `${location.pathname}${location.search}`);
    return m[1];
  }
  const syDecode = (v) => {
    const m = /^([\w-]{20,})\.([0-9a-f]{64})$/.exec(v || '');
    return m ? { u: `https://script.google.com/macros/s/${m[1]}/exec`, t: m[2] } : null;
  };
  document.addEventListener('visibilitychange', () => {
    if (!SY.conf) return;
    if (document.hidden) { if (SY.meta.dirty) syncPush(); return; }
    if (Date.now() - SY.lastPull > 15000) syncPull();
  });
  window.addEventListener('online', () => { if (SY.conf && SY.meta.dirty) syncPush(); });
  // 켜 둔 동안 30초마다 판만 보고, 다른 기기가 고쳤으면 받음(교사 요청 2026-10-29: PC·폰 어디서 체크하든 서로 따라오게)
  setInterval(async () => {
    if (!SY.conf || SY.busy || document.hidden || Date.now() - SY.lastPull < 25000) return;
    SY.lastPull = Date.now();
    try { const h = await storeCall({ a: 'head' }); if (h.ok && h.rev > SY.meta.rev) syncPull(); } catch { /* 다음에 */ }
  }, 30000);

  // ── 탭 ────────────────────────────────────────────────
  function switchTab(t) {
    syncBoxTab();
    if ((t === 'box' && (APP === 'class' || !S.classes.some(isHome))) || (t === 'docs' && APP === 'class')) t = 'check';
    tab = t;
    editing = null;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
    $('#dateNav').style.visibility = t === 'setup' || t === 'docs' || t === 'box' ? 'hidden' : '';
    if (t === 'check') renderCheck();
    if (t === 'export') { exp = { from: '', to: '' }; renderExport(); }
    if (t === 'setup') renderSetup();
    if (t === 'docs') renderDocs();
    if (t === 'box') { renderBox(); refreshBox(true); } // 연결 창이 열려 있을 때만 바로 받음
    window.scrollTo(0, 0);
  }
  $('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) switchTab(b.dataset.tab); });

  paintDate();
  const sfLinked = sfFromLink();
  switchTab(sfLinked ? 'box' : S.classes.length ? 'check' : 'setup');
  if (S.cfg.sf && !sfLinked) setTimeout(() => refreshBox(true), 600);
  const syLinked = syFromLink();
  rosterFromLink().then((msg) => {
    if (msg) { switchTab('check'); showHomeSheet(msg); }
  }).catch((err) => toast(err.message || '링크의 명단을 읽지 못했어요')).then(() => {
    // 자동 저장: 링크에 열쇠가 있으면 연결(처음이면 구글 자료를 받아 옴), 아니면 최신 자료를 받음
    const conf = syDecode(syLinked || SY.linked || '');
    if (conf && !(SY.conf && SY.conf.u === conf.u && SY.conf.t === conf.t)) syncConnect(conf).catch((err) => toast(err.message));
    else if (SY.conf) setTimeout(() => syncPull(), 300);
  });
})();
</script>
</body>
</html>
