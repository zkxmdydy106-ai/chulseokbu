<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>학생 서류 제출</title>
<style>
  body { margin: 0; padding: 22px 18px; background: #f4f6f9; color: #222; font: 15px/1.6 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .card { max-width: 460px; margin: 0 auto; padding: 18px; background: #fff; border: 1px solid #dde2e9; border-radius: 4px; }
  h1 { margin: 0 0 8px; font-size: 17px; }
  p { margin: 8px 0; font-size: 14px; color: #444; }
  ol { margin: 8px 0; padding-left: 20px; font-size: 14px; color: #444; }
  a.btn, button { display: block; width: 100%; margin: 10px 0 0; padding: 11px; border: 1px solid #2a64d6; border-radius: 4px; background: #2a64d6; color: #fff; font: inherit; font-weight: 600; text-align: center; text-decoration: none; }
  button.line { background: #fff; color: #2a64d6; }
  .err { color: #c4392b; }
.dim { font-size: 13px; color: #6b7280; }
input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px; border: 1px solid #c5ccd6; border-radius: 4px; font: inherit; }
.nums { display: flex; gap: 6px; margin-top: 6px; }
.nums a { flex: 1; padding: 6px 0; border: 1px solid #c5ccd6; border-radius: 4px; color: #222; text-align: center; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
<div class="card" id="box"><p id="msg">여는 중…</p></div>
<script>
  // 학생 서류 반 링크의 입구(교사 요청 2026-11-02 '어떤 곳에서도'): 카톡 등 앱 안 브라우저에서는 구글 로그인이 막히므로 바깥 브라우저로 넘긴 뒤 받는 곳으로 간다.
  // 반 비밀값은 주소의 '#' 뒤에 있어 이 공개판 서버로 가지 않는다. 이 쪽은 저장하는 것이 없다.
  (function () {
    var q = new URLSearchParams(location.hash.slice(1));
    var u = q.get('u') || '', b = q.get('b') || '', k = q.get('k') || '';
    var box = document.getElementById('box');
    // 받는 곳 주소는 구글 Apps Script 웹 앱만(다른 주소로 넘기지 않음)
    var okUrl = /^(macros|a\/macros\/[\w.-]+)\/s\/[\w-]{20,}\/exec$/.test(u) && /^\d-\d{1,2}$/.test(b) && /^[A-Za-z0-9_-]{16,64}$/.test(k);
    if (!okUrl) { box.innerHTML = '<h1>링크가 잘렸어요</h1><p class="err">선생님이 올린 반 링크를 다시 눌러 주세요.</p>'; return; }
    var target = 'https://script.google.com/' + u + '?' + new URLSearchParams({ p: 's', b: b, k: k });
    var ua = navigator.userAgent || '';
    var android = /Android/i.test(ua);
    var inApp = /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER\(|DaumApps|everytimeApp|BAND\/|; wv\)/i.test(ua);

    function manual(note) {
      box.innerHTML = '<h1>다른 브라우저로 열어 주세요</h1>'
        + '<p>' + note + '</p>'
        + '<ol><li>' + (android ? '오른쪽 위 메뉴(⋮)' : '오른쪽 아래 공유 또는 메뉴') + '를 누르고</li><li>\'다른 브라우저로 열기\'(사파리·크롬)를 눌러 주세요.</li></ol>'
        + '<button id="copy" class="line">링크 복사(브라우저 주소 칸에 붙여 넣기)</button><a class="btn" href="' + target.replace(/&/g, '&amp;') + '">이대로 열기</a>'
        + '<p id="done"></p>';
      document.getElementById('copy').onclick = function () {
        var d = document.getElementById('done');
        (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.reject()).then(function () { d.textContent = '복사했어요.'; }, function () { d.textContent = location.href; });
      };
    }

    if (/KAKAOTALK/i.test(ua)) {
      // 카카오톡 안 브라우저: 바깥 브라우저로 이 쪽을 다시 연다
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
      setTimeout(function () { manual('카카오톡 안에서는 구글 로그인이 안 될 수 있어요.'); }, 1500);
      return;
    }
    if (inApp && android) {
      location.href = 'intent://' + location.host + location.pathname + location.hash + '#Intent;scheme=https;end';
      setTimeout(function () { manual('이 앱 안에서는 구글 로그인이 안 될 수 있어요.'); }, 1500);
      return;
    }
    if (inApp) { manual('이 앱 안에서는 구글 로그인이 안 될 수 있어요.'); return; }
    // 폰에 구글 계정이 여러 개면 첫 계정으로 열려 안 열릴 수 있다(교사 결정 2026-11-10 '학교 계정 주소 한 번'):
    // 학교 계정 주소를 한 번 받아 이 폰에만 기억하고, 구글 계정 선택을 거쳐 그 계정으로 연다. 주소는 구글에만 가고 선생님·이 공개판으로는 가지 않는다
    var KEY = 'chulseokbu.stuAcct';
    var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    function saved() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
    function open(email) {
      var t = target + '&authuser=' + encodeURIComponent(email);
      location.replace('https://accounts.google.com/AccountChooser?' + new URLSearchParams({ Email: email, continue: t }));
    }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    var nums = '<p class="dim">계속 안 열리면 폰에 로그인한 순서로 열어 보세요.</p><div class="nums">'
      + [0, 1, 2].map(function (n) { return '<a href="' + (target + '&authuser=' + n).replace(/&/g, '&amp;') + '">' + (n + 1) + '번째 계정</a>'; }).join('') + '</div>';
    function ask(note) {
      box.innerHTML = '<h1>학교 구글 계정으로 열어요</h1>'
        + '<p>학교 구글 계정 주소를 한 번만 적어 주세요. 다음부터는 저절로 그 계정으로 열려요. 주소는 이 폰에만 기억해요.</p>'
        + '<input id="em" type="email" autocomplete="email" placeholder="예: 20301@school.cnehs.kr" aria-label="학교 구글 계정 주소">'
        + '<p id="emMsg" class="err">' + (note || '') + '</p>'
        + '<button id="go">이 계정으로 열기</button>'
        + '<p class="dim">구글 계정이 하나뿐이면 <a href="' + target.replace(/&/g, '&amp;') + '">그냥 열기</a></p>' + nums;
      var em = document.getElementById('em');
      var go = function () {
        var v = String(em.value || '').trim().toLowerCase();
        if (!EMAIL.test(v)) { document.getElementById('emMsg').textContent = '계정 주소 모양이 달라요.'; return; }
        try { localStorage.setItem(KEY, v); } catch (e) { /* 기억 못 해도 이번엔 연다 */ }
        open(v);
      };
      document.getElementById('go').onclick = go;
      em.onkeydown = function (e) { if (e.key === 'Enter') go(); };
      em.focus();
    }
    var me = saved();
    if (!EMAIL.test(me)) { ask(''); return; }
    box.innerHTML = '<h1>여는 중…</h1><p><b>' + esc(me) + '</b> 계정으로 열어요.</p><button id="other" class="line">다른 계정 주소 적기</button>' + nums;
    var timer = setTimeout(function () { open(me); }, 900);
    document.getElementById('other').onclick = function () { clearTimeout(timer); try { localStorage.removeItem(KEY); } catch (e) { } ask(''); };
  })();
</script>
</body>
</html>
