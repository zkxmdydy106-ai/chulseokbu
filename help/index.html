<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>업무 도우미 사용 설명서</title>
<meta name="description" content="나이스·에듀파인 반복 입력을 줄여 주는 교사용 확장프로그램의 설치와 기능별 사용 방법을 영상으로 안내해요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314161a'/%3E%3Cpath d='M7 8.5A1.5 1.5 0 0 1 8.5 7h5A1.5 1.5 0 0 1 15 8.5v5a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 7 13.5zm10 0A1.5 1.5 0 0 1 18.500 7h5A1.5 1.5 0 0 1 25 8.5v5a1.5 1.5 0 0 1-1.5 1.5h-5a1.5 1.5 0 0 1-1.5-1.5zm-10 10A1.5 1.5 0 0 1 8.500 17h5a1.5 1.5 0 0 1 1.5 1.500v5a1.5 1.5 0 0 1-1.500 1.5h-5A1.5 1.5 0 0 1 7 23.500z' fill='%23fff'/%3E%3Crect x='17' y='17' width='8' height='8' rx='1.5' fill='%234f86ee'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  color-scheme: light;
  --ink: #14161a; --ink-2: #41464f; --ink-3: #6b717c; --ink-4: #a2a7b0;
  --line: #e8eaee; --line-2: #dcdfe5; --fill: #f0f1f4; --stage: #f5f6f8;
  --accent: #2a64d6; --accent-dark: #2053b8;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: Consolas, "D2Coding", ui-monospace, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --top: 56px; --sub: 46px; --gut: 28px;
  /* 영상 아래 조작 줄(크게 보기에서는 어두운 판에 맞춰 바뀜) */
  --ctl: var(--ink-2); --ctl-dim: var(--ink-3); --ctl-fill: var(--accent); --ctl-track: #d9dce2; --seg: #e9ebef; --seg-on: #fff; --seg-on-ink: var(--ink);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body { display: flex; flex-direction: column; margin: 0; min-height: 100vh; min-height: 100dvh; background: #fff; color: var(--ink); font: 400 15.5px/1.55 var(--font); letter-spacing: -.012em; word-break: keep-all; overflow-wrap: anywhere; overflow-x: clip; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; letter-spacing: inherit; color: inherit; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* 윗줄: 이름 + 묶음 탭 + 설치하기 */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: stretch; height: var(--top); padding: 0 var(--gut); background: #fff; border-bottom: 1px solid var(--line); }
.brand { display: flex; margin: 0; font: inherit; letter-spacing: inherit; }
.brand a { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: -.028em; text-decoration: none; white-space: nowrap; }
.brand svg { width: 20px; height: 20px; flex: none; }
.tabs { position: relative; display: flex; min-width: 0; margin: 0 auto 0 20px; }
.tab { padding: 0 11px; border: 0; background: none; color: var(--ink-3); font-size: 15px; font-weight: 500; letter-spacing: -.02em; white-space: nowrap; cursor: pointer; transition: color .12s; }
.tab:hover, .tab[aria-selected="true"] { color: var(--ink); }
.tab:focus-visible { outline-offset: -6px; }
.ind { position: absolute; left: 0; bottom: -1px; width: 0; height: 2px; background: var(--ink); pointer-events: none; }
.cta { align-self: center; flex: none; margin-left: 16px; padding: 6px 12px; border-radius: 7px; background: var(--fill); font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap; transition: background .12s; }
.cta:hover { background: #e6e8ec; }

/* 둘째 줄: 묶음 안 기능 + 묶음 한 줄 소개 */
.sub { display: flex; align-items: center; justify-content: space-between; gap: 8px 20px; min-height: var(--sub); padding: 0 var(--gut); border-bottom: 1px solid var(--line); }
.pills { display: flex; gap: 2px; min-width: 0; margin-left: -10px; }
.pill { padding: 5px 10px; border: 0; border-radius: 6px; background: none; color: var(--ink-3); font-size: 14px; font-weight: 500; letter-spacing: -.018em; white-space: nowrap; cursor: pointer; transition: color .12s, background .12s; }
.pill:hover { color: var(--ink); }
.pill[aria-selected="true"] { background: var(--fill); color: var(--ink); }
.intro { margin: 0; color: var(--ink-3); font-size: 13.5px; }

/* 한 기능: 왼쪽 글 + 오른쪽 회색 무대 */
.page { flex: 1; display: grid; grid-template-columns: clamp(336px, 28vw, 430px) minmax(0, 1fr); outline: none; }
.text { padding: 30px 24px 28px var(--gut); }
.stage { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; padding: 24px clamp(24px, 3vw, 48px); background: var(--stage); }
.head h2 { margin: 0; font-size: clamp(27px, 2.5vw, 34px); font-weight: 700; line-height: 1.24; letter-spacing: -.036em; }
.head h2.lead { font-size: clamp(32px, 3vw, 42px); line-height: 1.2; letter-spacing: -.042em; }
.who { margin: 8px 0 0; color: var(--ink-3); font-size: 14.5px; line-height: 1.5; }
.side-label { margin: 26px 0 10px; font-size: 14px; font-weight: 600; letter-spacing: -.02em; }

ol.steps { margin: 20px 0 0; padding: 0; list-style: none; counter-reset: s; border-top: 1px solid var(--line); }
.side-label + ol.steps { margin-top: 0; }
ol.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); counter-increment: s; }
ol.steps li::before { content: counter(s); color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
/* 패널의 단추 이름 */
.ui { color: var(--ink); font-weight: 600; letter-spacing: -.02em; }
code { padding: 1px 5px; border-radius: 4px; background: var(--fill); color: var(--ink); font: 13.5px/1.4 var(--mono); letter-spacing: 0; white-space: nowrap; }
.note { margin: 14px 0 0; padding: 11px 13px; border-radius: 7px; background: var(--stage); color: var(--ink-2); font-size: 14px; line-height: 1.55; }
.go-row { margin: 20px 0 0; }
.btn { display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14.5px; font-weight: 600; letter-spacing: -.02em; text-decoration: none; white-space: nowrap; cursor: pointer; transition: background .12s; }
.btn:hover { background: var(--accent-dark); }
.ver { margin-left: 8px; color: var(--ink-3); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.quiet-link { display: inline-block; margin-top: 12px; color: var(--ink-3); font-size: 14px; text-underline-offset: 3px; }
.quiet-link:hover { color: var(--ink); }

/* 영상 */
.player { width: 100%; max-width: min(1320px, max(460px, calc((100vh - var(--top) - var(--sub) - 180px) * 5 / 3))); margin: 0; }
.player, .board { position: sticky; top: calc(var(--top) + 14px); }
.screen { position: relative; aspect-ratio: 5 / 3; overflow: hidden; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px rgba(20, 22, 26, .09), 0 1px 2px rgba(20, 22, 26, .05), 0 22px 44px -26px rgba(20, 22, 26, .24); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: #fff; opacity: 0; cursor: pointer; }
.ready video { opacity: 1; }
.resume { position: absolute; left: 50%; top: 50%; display: none; place-items: center; width: 56px; height: 56px; margin: -28px 0 0 -28px; border: 0; border-radius: 50%; background: rgba(20, 22, 26, .78); color: #fff; cursor: pointer; }
.resume svg { width: 22px; height: 22px; margin-left: 2px; }
.paused .resume { display: grid; }
.vid-err { position: absolute; inset: 0; display: none; place-items: center; margin: 0; color: var(--ink-3); font-size: 14.5px; }
.failed .vid-err { display: grid; }
.failed .resume { display: none; }

.ctl { display: flex; align-items: center; gap: 6px 10px; margin-top: 10px; color: var(--ctl); }
.ic { display: grid; place-items: center; flex: none; width: 30px; height: 30px; margin-left: -6px; border: 0; border-radius: 6px; background: none; cursor: pointer; }
.ic svg { width: 15px; height: 15px; }
.ic:hover, .ghost:hover { background: rgba(20, 22, 26, .06); }
.seek { --p: 0%; flex: 1 1 120px; min-width: 0; height: 24px; margin: 0; background: none; cursor: pointer; -webkit-appearance: none; appearance: none; }
.seek::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--ctl-fill) var(--p), var(--ctl-track) var(--p)); }
.seek::-webkit-slider-thumb { width: 11px; height: 11px; margin-top: -4px; border-radius: 50%; background: var(--ctl-fill); opacity: 0; transition: opacity .12s; -webkit-appearance: none; }
.seek:hover::-webkit-slider-thumb, .seek:focus-visible::-webkit-slider-thumb { opacity: 1; }
.seek::-moz-range-track { height: 3px; border-radius: 2px; background: var(--ctl-track); }
.seek::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--ctl-fill); }
.seek::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--ctl-fill); }
.time { flex: none; color: var(--ctl-dim); font-size: 12.5px; font-variant-numeric: tabular-nums; letter-spacing: 0; white-space: nowrap; }
.speeds { display: flex; flex: none; padding: 2px; border-radius: 7px; background: var(--seg); }
.speed { padding: 2px 8px; border: 0; border-radius: 5px; background: none; color: var(--ctl-dim); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; cursor: pointer; }
.speed:hover { color: var(--ctl); }
.speed[aria-pressed="true"] { background: var(--seg-on); color: var(--seg-on-ink); box-shadow: 0 0 0 .5px rgba(20, 22, 26, .08), 0 1px 2px rgba(20, 22, 26, .08); }
.ghost { display: inline-flex; flex: none; align-items: center; gap: 5px; height: 30px; margin-right: -6px; padding: 0 7px; border: 0; border-radius: 6px; background: none; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.ghost svg { width: 13px; height: 13px; }
.cap { margin: 4px 0 0; color: var(--ink-3); font-size: 12.5px; }

/* 영상이 없는 쪽도 영상과 같은 자리에 같은 판 */
.board { display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: min(1320px, max(460px, calc((100vh - var(--top) - var(--sub) - 180px) * 5 / 3))); padding: 12px clamp(24px, 3.4vw, 44px); overflow: visible; }
.soon { align-items: center; text-align: center; }
.soon svg { width: 22px; height: 22px; margin: 0 auto 12px; color: var(--ink-4); }
.soon b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -.025em; }
.soon span { color: var(--ink-3); font-size: 14px; }

/* 설치: 브라우저별 표 + 새 판 */
.map { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.map th { padding: 0 14px 9px 0; border-bottom: 1px solid var(--line-2); color: var(--ink-3); font-size: 13px; font-weight: 500; text-align: left; }
.map td { padding: 13px 14px 13px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
.map th:last-child, .map td:last-child { padding-right: 0; }
.map td:first-child { font-weight: 600; white-space: nowrap; }
.update { margin-top: 26px; }
.update h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; letter-spacing: -.024em; }
.update p { margin: 0; color: var(--ink-2); font-size: 14.5px; }

/* 약속 */
.vow { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: baseline; gap: 6px 24px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.vow:last-child { border-bottom: 0; }
.vow b { font-size: clamp(18px, 1.7vw, 21px); font-weight: 600; line-height: 1.34; letter-spacing: -.03em; }
.vow span { color: var(--ink-2); font-size: 15px; }

.foot { display: flex; justify-content: space-between; gap: 6px 24px; padding: 11px var(--gut); border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12.5px; line-height: 1.5; }
.foot a { flex: none; text-underline-offset: 3px; }
.foot a:hover { color: var(--ink); }

/* 크게 보기: 어두운 판 위에 같은 영상을 옮겨 놓음 */
.big { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 44px 24px 16px; background: #0d0e11; --ctl: #e9eaed; --ctl-dim: #a5a9b2; --ctl-fill: #fff; --ctl-track: rgba(255, 255, 255, .24); --seg: rgba(255, 255, 255, .12); --seg-on: rgba(255, 255, 255, .22); --seg-on-ink: #fff; }
.big.on { display: flex; }
.big .player { position: static; width: min(100%, calc((100vh - 110px) * 5 / 3)); max-width: none; }
.big .screen { box-shadow: none; }
.big .ic:hover { background: rgba(255, 255, 255, .12); }
.big .cap, .big #bigOpen { display: none; }
.big .ctl { margin-right: 0; }
.closer { position: absolute; top: 8px; right: 14px; height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: rgba(255, 255, 255, .12); color: #fff; font-size: 13.5px; font-weight: 500; cursor: pointer; }
.closer:hover { background: rgba(255, 255, 255, .2); }

/* 움직임: 쪽을 넘길 때 짧게 한 번 */
@media (prefers-reduced-motion: no-preference) {
  .ind.move { transition: transform .26s var(--ease), width .26s var(--ease); }
  /* 영상을 받는 동안(학교 망은 느릴 수 있음) 잠깐 뒤에 나타나는 표시 */
  .player:not(.ready):not(.paused) .screen::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid var(--line-2); border-top-color: var(--ink-3); border-radius: 50%; animation: spin .8s linear infinite, fade .2s .4s backwards; }
  .text > *, .stage > * { animation: rise .3s var(--ease) backwards; }
  .stage > * { animation-delay: 40ms; }
  ol.steps li { animation: fade .3s var(--ease) backwards; animation-delay: calc(40ms + var(--i) * 26ms); }
  video { transition: opacity .22s var(--ease); }
}
@keyframes rise { from { opacity: 0; transform: translateY(5px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* 이름과 탭이 한 줄에 안 들어가면 두 줄로 */
@media (max-width: 1020px) {
  .top { flex-wrap: wrap; height: auto; top: -50px; padding: 0; }
  .brand { flex: 1; height: 50px; padding-left: var(--gut); }
  .cta { margin: 0 var(--gut) 0 0; }
  .tabs { order: 3; flex: 1 0 100%; width: 100%; height: 44px; margin: 0; padding: 0 calc(var(--gut) - 11px); border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar, .pills::-webkit-scrollbar { display: none; }
  .ind { bottom: 0; }
}
/* 좁으면 위에서 아래로: 제목 → 영상 → 순서 */
@media (max-width: 860px) {
  :root { --gut: 20px; }
  .page { display: flex; flex-direction: column; }
  .text { display: contents; }
  .head { order: 1; padding: 22px var(--gut) 18px; }
  .stage { order: 2; padding: 14px; }
  ol.steps, .side-label { order: 3; margin: 0 var(--gut); }
  .side-label { padding-top: 22px; margin-bottom: 8px; }
  ol.steps { margin-top: 18px; }
  .side-label + ol.steps { margin-top: 0; }
  .note { order: 4; margin: 14px var(--gut) 0; }
  .go-row, .quiet-link { order: 5; margin: 18px var(--gut) 0; }
  .page { padding-bottom: 26px; }
  .sub { flex-wrap: wrap; padding-top: 7px; padding-bottom: 7px; }
  .pills { max-width: calc(100% + 10px); overflow-x: auto; scrollbar-width: none; }
  .pills:not([hidden]) + .intro { display: none; }
  .player, .board { position: static; max-width: none; }
  .board:not(.soon) { aspect-ratio: auto; padding: 18px 20px; }
  .foot { flex-direction: column; }
}
@media (max-width: 520px) {
  :root { --gut: 16px; }
  .stage { padding: 12px; }
  .board:not(.soon) { padding: 14px 16px; }
  .ctl { flex-wrap: wrap; }
  .seek { flex-basis: calc(100% - 110px); }
  .speeds { margin-right: auto; }
  .vow { grid-template-columns: minmax(0, 1fr); padding: 18px 0; }
  .map { font-size: 14px; }
  .map th:nth-child(3), .map td:nth-child(3) { display: none; }
  .btn { height: 42px; }
}
</style>
</head>

<header class="top">
  <h1 class="brand"><a href="#overview"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#14161a"/><path d="M7 8.500A1.500 1.500 0 0 1 8.500 7h5A1.500 1.500 0 0 1 15 8.500v5a1.500 1.500 0 0 1-1.500 1.500h-5A1.500 1.500 0 0 1 7 13.500zm10 0A1.500 1.500 0 0 1 18.500 7h5A1.500 1.500 0 0 1 25 8.500v5a1.500 1.500 0 0 1-1.500 1.500h-5a1.500 1.500 0 0 1-1.500-1.500zm-10 10A1.500 1.500 0 0 1 8.500 17h5a1.500 1.500 0 0 1 1.500 1.500v5a1.500 1.500 0 0 1-1.500 1.500h-5A1.500 1.500 0 0 1 7 23.500z" fill="#fff"/><rect x="17" y="17" width="8" height="8" rx="1.500" fill="#4f86ee"/></svg>업무 도우미 사용 설명서</a></h1>
  <div class="tabs" id="tabs" role="tablist" aria-label="기능 묶음"></div>
  <a class="cta" href="#install">설치하기</a>
</header>
<div class="sub">
  <div class="pills" id="pills" role="tablist" aria-label="이 묶음의 기능"></div>
  <p class="intro" id="talk" aria-live="polite"></p>
</div>
<main class="page" id="sheet" role="tabpanel" tabindex="-1"></main>
<footer class="foot"><span>영상은 실제 나이스 화면에서 찍었고, 학생·교사 이름과 학교, 복무 정보는 가렸어요. 영상 속 값은 시험용이고, 시험으로 만든 줄은 모두 지웠어요.</span><a href="../privacy.html">개인정보 처리방침</a></footer>
<div class="big" id="big" role="dialog" aria-modal="true" aria-label="크게 보기"><button class="closer" id="bigClose">닫기</button></div>
<script src="videos.js"></script>
<script>
const FEATURES = [
  { group: '시작하기', cls: 'c-start', intro: '처음이면 여기부터 보세요!', items: [
    { id: 'overview', short: '한눈에 보기', title: '도우미가 하는 일', who: '출결·생기부·평가·복무를 패널에서 골라요', steps: ['나이스에 로그인하고 주소창 옆 도우미 아이콘을 눌러요. 오른쪽에 패널이 열려요.', '파일을 끌어다 놓거나 폰 출석부로 체크해요.', '넣을 값과 지금 나이스 값을 표로 비교해요.', '버튼 한 번이면 모두 채워져요.'], note: '마감과 결재는 선생님이 직접 해요.', go: 'install', goText: '설치하러 가기' },
    { id: 'install', short: '설치하기', title: '설치는 다섯 걸음', who: '처음 한 번만 하면 돼요. 스토어 등록 전이라 파일로 설치해요.', kind: 'install' },
    { id: 'promise', short: '도우미의 약속', title: '도우미의 약속', kind: 'promise' },

      <div class="vow"><b>마감·<wbr>결재는 선생님이</b><span>마감·<wbr>승인요청·<wbr>상신·<wbr>삭제 단추는 도우미가 누르지 않아요.</span></div>
      <div class="vow"><b>처음 한 번은 1건만</b><span>새 화면은 1건 넣어 맞는지 본 뒤 나머지를 넣어요.</span></div></div></div>`;
  return `<div class="text">${head}${LEAD[f.id] ? `<p class="side-label">${esc(f.title)}</p>` : ''}${safeSteps(f)}${f.note ? `<p class="note">${rich(esc(f.note))}</p>` : ''}${f.go ? `<p class="go-row"><button class="btn" data-go="${f.go}">${esc(f.goText)}</button></p>` : ''}</div><div class="stage" id="stage">${videoBox(f)}</div>`;
}

// 영상 조작 줄: 고른 영상 하나만 받아 틀고, 위치 표시는 재생하는 동안만 그린다
const clock = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
let raf = 0, seeking = false;
function paintTime() {
  const v = $('vid'), s = $('seek'), t = $('time');
  if (!v || !s || !t || !v.duration) return;
  const r = v.currentTime / v.duration;
  if (!seeking) s.value = Math.round(r * 1000);
  s.style.setProperty('--p', `${r * 100}%`);
  t.textContent = `${clock(v.currentTime)} / ${clock(v.duration)}`;
}
function loop() { paintTime(); raf = requestAnimationFrame(loop); }
function halt() { cancelAnimationFrame(raf); raf = 0; }
function paintPlay() {
  const v = $('vid'), p = $('player'), b = $('play');
  if (!v || !p || !b) return;
  p.classList.toggle('paused', v.paused);
  b.innerHTML = v.paused ? ICON.play : ICON.pause;
  b.setAttribute('aria-label', v.paused ? '재생' : '일시정지');
}
function wire(v) {
  const p = $('player');
  v.defaultPlaybackRate = speed;
  v.playbackRate = speed;
  v.addEventListener('loadeddata', () => { p.classList.add('ready'); paintTime(); }, { once: true });
  v.addEventListener('error', () => { p.classList.add('ready', 'failed'); halt(); }, { once: true });
  v.addEventListener('play', () => { paintPlay(); if (!raf) loop(); });
  v.addEventListener('pause', () => { paintPlay(); halt(); paintTime(); });
  v.addEventListener('seeked', paintTime);
  if (!reduce) v.play().catch(() => paintPlay());
  paintPlay();
}
function toggle() {
  const v = $('vid');
  if (v) { if (v.paused) v.play().catch(() => {}); else v.pause(); }
}
function stopVideo() {
  const v = $('vid');
  halt();
  if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
}
function placeInd(move) {
  const t = document.querySelector('#tabs .tab[aria-selected="true"]'), ind = $('ind');
  if (!t || !ind) return;
  const pad = parseFloat(getComputedStyle(t).paddingLeft) || 0;
  ind.classList.toggle('move', !!move);
  ind.style.width = `${t.offsetWidth - pad * 2}px`;
  ind.style.transform = `translateX(${t.offsetLeft + pad}px)`;
}
// 탭을 고르면 그 탭의 기능 하나만 보인다. 영상도 고른 것 하나만 받아서 틀어 데이터와 렉을 줄인다(교사 요청 2026-11-02)
function show(id, { push = true } = {}) {
  const hit = FIND[id] || FIND.overview;
  const { g, gi, f } = hit;
  if (current === f.id) return;
  closeBig();
  stopVideo();
  const first = !current;
  current = f.id;
  lastIn[gi] = f.id;
  $('talk').textContent = g.intro;
  document.querySelectorAll('#tabs .tab').forEach((t, i) => { const on = i === gi; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; });
  const pills = $('pills');
  pills.hidden = g.items.length < 2;
  pills.style.display = g.items.length < 2 ? 'none' : '';
  pills.innerHTML = g.items.map((x) => `<button class="pill" role="tab" data-id="${x.id}" aria-selected="${x.id === f.id}" tabindex="${x.id === f.id ? 0 : -1}" aria-controls="sheet">${esc(x.short || x.title)}</button>`).join('');
  $('sheet').innerHTML = pageHtml(hit);
  $('sheet').setAttribute('aria-label', `${g.group} · ${f.short || f.title}`);
  const v = $('vid');
  if (v) wire(v);
  if ($('dlVer')) loadVersion();
  if (push) history.replaceState(null, '', `#${f.id}`);
  placeInd(!first);
  // 좁은 화면에서는 고른 탭이 탭 줄 가운데로
  const nav = $('tabs'), on = nav.querySelector('.tab[aria-selected="true"]');
  if (on && nav.scrollWidth > nav.clientWidth) nav.scrollTo({ left: on.offsetLeft - (nav.clientWidth - on.offsetWidth) / 2, behavior: reduce || first ? 'auto' : 'smooth' });
  if (scrollY > 0) scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}
function loadVersion() {
  fetch('version.json', { cache: 'no-store' }).then((r) => r.json()).then((j) => { if ($('dlVer')) $('dlVer').textContent = `v${j.version}`; }).catch(() => {});
}
$('tabs').innerHTML = FEATURES.map((g, i) => `<button class="tab" role="tab" data-g="${i}" aria-selected="false" tabindex="-1" aria-controls="sheet">${esc(g.group)}</button>`).join('') + '<span class="ind" id="ind" role="presentation"></span>';
// 탭·기능 줄은 화살표로도 옮겨 다닌다
function arrows(box, pick) {
  box.addEventListener('keydown', (e) => {
    const keys = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 1, ArrowUp: -1 };
    if (!(e.key in keys) && e.key !== 'Home' && e.key !== 'End') return;
    const all = [...box.querySelectorAll('[role="tab"]')];
    const at = all.indexOf(document.activeElement);
    if (at < 0) return;
    e.preventDefault();
    const to = e.key === 'Home' ? 0 : e.key === 'End' ? all.length - 1 : (at + keys[e.key] + all.length) % all.length;
    pick(all[to]);
    box.querySelectorAll('[role="tab"]')[to]?.focus();
  });
}
const pickTab = (t) => { const gi = +t.dataset.g; show(lastIn[gi] || FEATURES[gi].items[0].id); };
const pickPill = (p) => show(p.dataset.id);
arrows($('tabs'), pickTab);
arrows($('pills'), pickPill);
// 크게 보기: 영상을 새로 받지 않고 그대로 어두운 판으로 옮긴다
const big = $('big');
let bigFrom = null;
function moveAndKeep(to) {
  const p = $('player'), v = $('vid');
  if (!p || !v) return;
  const going = !v.paused;
  to.appendChild(p);
  if (going) v.play().catch(() => {});
}
const behindBig = (on) => document.querySelectorAll('.top, .sub, .page, .foot').forEach((el) => { el.inert = on; });
function openBig(from) {
  bigFrom = from;
  moveAndKeep(big);
  big.classList.add('on');
  behindBig(true);
  $('bigClose').focus();
}
function closeBig() {
  if (!big.classList.contains('on')) return;
  big.classList.remove('on');
  behindBig(false);
  moveAndKeep($('stage'));
  bigFrom = $('bigOpen') || bigFrom;
  bigFrom?.focus();
}
document.addEventListener('click', (e) => {
  const on = (sel) => e.target.closest(sel);
  const t = on('.tab');
  if (t) { pickTab(t); return; }
  const p = on('.pill');
  if (p) { pickPill(p); return; }
  const go = on('[data-go]');
  if (go) { show(go.dataset.go); return; }
  if (on('#play') || on('#resume') || e.target.id === 'vid') { toggle(); return; }
  const sp = on('.speed');
  if (sp) {
    speed = +sp.dataset.speed;
    const v = $('vid');
    if (v) { v.defaultPlaybackRate = speed; v.playbackRate = speed; }
    document.querySelectorAll('.speed').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.speed === speed));
    return;
  }
  const bo = on('#bigOpen');
  if (bo) { openBig(bo); return; }
  if (on('#bigClose') || e.target === big) closeBig();
});
document.addEventListener('input', (e) => {
  if (e.target.id !== 'seek') return;
  const v = $('vid');
  if (v?.duration) { v.currentTime = (e.target.value / 1000) * v.duration; paintTime(); }
});
document.addEventListener('pointerdown', (e) => { if (e.target.id === 'seek') seeking = true; });
addEventListener('pointerup', () => { seeking = false; });
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBig(); });
addEventListener('resize', () => placeInd(false));
// 글꼴은 글자 묶음별로 늦게 받으므로 받을 때마다 밑줄 폭을 다시 맞춘다
document.fonts?.ready.then(() => placeInd(false));
document.fonts?.addEventListener?.('loadingdone', () => placeInd(false));
// 패널 [설명]은 #daily처럼 그 기능으로 바로 온다
const fromHash = () => decodeURIComponent(location.hash.slice(1));
addEventListener('hashchange', () => show(fromHash()));
show(fromHash() || 'overview', { push: !!fromHash() });
</script>
</body>
</html>
